# Install a single SQL Server 2022 instance (UAT).
#
# Target inventory group: [mssql]  (the web UI writes a per-job inventory file)
#
# Required variable (pass via --extra-vars from the web UI):
#   sa_password   strong SA password (>=8 chars, upper/lower/digit/symbol)
# Optional:
#   mssql_pid     edition: Developer (default) | Express | Standard | Enterprise | EnterpriseCore
#   ubuntu_release  apt repo release, default "22.04"

- name: Install SQL Server 2022 (single instance)
  hosts: mssql
  become: true
  # Effective values use distinct *_eff names so play vars never reference themselves
  # (Ansible 2.20 rejects self-referential vars as a recursive loop).
  vars:
    mssql_pid_eff: "{{ mssql_pid | default('Developer') }}"
    ubuntu_release_eff: "{{ ubuntu_release | default('22.04') }}"
    sa_password_eff: "{{ sa_password | default('') }}"
  tasks:
    - name: Fail early if SA password is not provided
      fail:
        msg: "sa_password is required (strong password: >=8 chars, mix of upper/lower/digit/symbol)."
      when: sa_password_eff | length == 0

    - name: Require at least ~2 GB RAM (SQL Server on Linux will not start with less)
      assert:
        that: ansible_facts['memtotal_mb'] | int >= 1900
        fail_msg: >-
          SQL Server on Linux needs >= 2 GB RAM; {{ inventory_hostname }} has
          {{ ansible_facts['memtotal_mb'] }} MB. Give the VM at least 2 GB (4 GB+ recommended).
        success_msg: "Memory OK ({{ ansible_facts['memtotal_mb'] }} MB)."

    - name: Require a SQL-Server-supported OS (Ubuntu 20.04 / 22.04)
      assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] in ['20.04', '22.04']
        fail_msg: >-
          SQL Server 2022 on Linux supports Ubuntu 20.04 or 22.04. This node is
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
          Newer Ubuntu ships OpenLDAP 2.6, so liblber-2.5.so.0 (libldap-2.5-0) is missing and
          sqlservr exits 127 on start. Use an Ubuntu 22.04 DB VM (recommended), or set
          mssql_skip_os_check=true to attempt the unsupported libldap-2.5 workaround.
        success_msg: "OS supported: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}."
      when: not (mssql_skip_os_check | default(false) | bool)

    - name: Ensure prerequisites are present
      apt:
        name: [curl, gnupg, apt-transport-https, ca-certificates]
        state: present
        update_cache: yes

    - name: Add Microsoft GPG key
      get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/trusted.gpg.d/microsoft.asc
        mode: "0644"

    - name: Add SQL Server 2022 apt repository
      get_url:
        url: "https://packages.microsoft.com/config/ubuntu/{{ ubuntu_release_eff }}/mssql-server-2022.list"
        dest: /etc/apt/sources.list.d/mssql-server-2022.list
        mode: "0644"

    - name: Add Microsoft prod (mssql-tools) apt repository
      get_url:
        url: "https://packages.microsoft.com/config/ubuntu/{{ ubuntu_release_eff }}/prod.list"
        dest: /etc/apt/sources.list.d/mssql-prod.list
        mode: "0644"

    - name: Install mssql-server
      apt:
        name: mssql-server
        state: present
        update_cache: yes

    - name: Ensure OpenLDAP 2.5 runtime is present (SQL Server needs liblber-2.5.so.0)
      apt:
        name: libldap-2.5-0
        state: present
      failed_when: false   # not available on unsupported newer Ubuntu; start diagnostics will flag it

    - name: Install mssql-tools and unixodbc-dev (sqlcmd)
      apt:
        name: [mssql-tools18, unixodbc-dev]
        state: present
      environment:
        ACCEPT_EULA: "Y"

    - name: Run mssql-conf setup (non-interactive)
      shell: |
        /opt/mssql/bin/mssql-conf -n setup accept-eula
      environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "{{ sa_password_eff }}"
        MSSQL_PID: "{{ mssql_pid_eff }}"
      args:
        creates: /var/opt/mssql/.system/instance_id

    - name: Ensure mssql-server service is enabled and started
      systemd:
        name: mssql-server
        state: started
        enabled: true
        daemon_reload: true
      register: mssql_start
      failed_when: false

    - name: Capture diagnostics if SQL Server failed to start
      when: mssql_start.status.ActiveState | default('') != 'active'
      shell: |
        echo "==== free -m ===="; free -m
        echo "==== systemctl status ===="; systemctl status mssql-server --no-pager -l 2>&1 | tail -25
        echo "==== journal (last 60) ===="; journalctl -xeu mssql-server.service --no-pager 2>&1 | tail -60
      register: mssql_diag
      changed_when: false

    - name: Fail with the real SQL Server start error
      when: mssql_start.status.ActiveState | default('') != 'active'
      fail:
        msg: |
          SQL Server failed to start on {{ inventory_hostname }} (most common cause: < 2 GB RAM).
          Diagnostics:
          {{ mssql_diag.stdout }}

    - name: Wait for SQL Server to accept connections on 1433
      wait_for:
        port: 1433
        host: 127.0.0.1
        timeout: 120

    - name: Verify connectivity with sqlcmd
      shell: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "{{ sa_password_eff }}" -No
        -Q "SELECT @@VERSION"
      register: mssql_version
      changed_when: false
      failed_when: mssql_version.rc != 0

    - name: Report SQL Server status
      debug:
        msg: "SQL Server 2022 single instance ready on {{ inventory_hostname }}:1433. {{ mssql_version.stdout_lines[0] | default('') }}"
