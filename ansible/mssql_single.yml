# Install a single SQL Server instance (UAT).
# Defaults to SQL Server 2025 on Ubuntu 24.04 — a Microsoft-supported combination.
#
# Target inventory group: [mssql]  (the web UI writes a per-job inventory file)
#
# Required variable (pass via --extra-vars from the web UI):
#   sa_password   strong SA password (>=8 chars, upper/lower/digit/symbol)
# Optional:
#   mssql_pid       edition: Developer (default) | Express | Standard | Enterprise | EnterpriseCore
#   mssql_version   2025 (default) | 2022
#   ubuntu_release  apt repo release, default "24.04" (2025: 22.04/24.04; 2022: 20.04/22.04)

- name: Install SQL Server (single instance)
  hosts: mssql
  become: true
  # Effective values use distinct *_eff names so play vars never reference themselves
  # (Ansible 2.20 rejects self-referential vars as a recursive loop).
  vars:
    mssql_pid_eff: "{{ mssql_pid | default('Developer') }}"
    mssql_version_eff: "{{ mssql_version | default('2025') }}"
    ubuntu_release_eff: "{{ ubuntu_release | default('24.04') }}"
    sa_password_eff: "{{ sa_password | default('') }}"
  tasks:
    - name: Fail early if SA password is not provided
      fail:
        msg: "sa_password is required (strong password: >=8 chars, mix of upper/lower/digit/symbol)."
      when: sa_password_eff | length == 0

    - name: Require at least ~2 GB RAM (SQL Server on Linux will not start with less)
      assert:
        that: ansible_facts['memtotal_mb'] | int >= 1900
        fail_msg: >-
          SQL Server on Linux needs >= 2 GB RAM; {{ inventory_hostname }} has
          {{ ansible_facts['memtotal_mb'] }} MB. Give the VM at least 2 GB (4 GB+ recommended).
        success_msg: "Memory OK ({{ ansible_facts['memtotal_mb'] }} MB)."

    - name: Check SQL Server OS support (WARN only — does not fail)
      vars:
        supported_releases: "{{ ['20.04','22.04'] if mssql_version_eff == '2022' else ['22.04','24.04'] }}"
      debug:
        msg: >-
          {{ ('OS supported: ' ~ ansible_facts['distribution'] ~ ' ' ~ ansible_facts['distribution_version']
              ~ ' for SQL Server ' ~ mssql_version_eff)
             if (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] in supported_releases)
             else ('WARNING: ' ~ ansible_facts['distribution'] ~ ' ' ~ ansible_facts['distribution_version'] ~
                   ' is NOT a SQL Server ' ~ mssql_version_eff ~ ' supported OS (Ubuntu ' ~ (supported_releases | join('/')) ~
                   '). Continuing anyway — the real start error (sqlservr/ldd) is surfaced below if it fails.') }}

    - name: Ensure prerequisites are present
      apt:
        name: [curl, gnupg, apt-transport-https, ca-certificates]
        state: present
        update_cache: yes

    - name: Add Microsoft GPG key
      get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/trusted.gpg.d/microsoft.asc
        mode: "0644"

    - name: Add SQL Server {{ mssql_version_eff }} engine apt repository
      get_url:
        url: "https://packages.microsoft.com/config/ubuntu/{{ ubuntu_release_eff }}/mssql-server-{{ mssql_version_eff }}.list"
        dest: "/etc/apt/sources.list.d/mssql-server-{{ mssql_version_eff }}.list"
        mode: "0644"

    # The Microsoft "prod" repo (mssql-tools18) is registered via packages-microsoft-prod.deb on
    # 24.04 (no prod.list there); the .deb also works on 22.04.
    - name: Download packages-microsoft-prod.deb (tools/prod repo)
      get_url:
        url: "https://packages.microsoft.com/config/ubuntu/{{ ubuntu_release_eff }}/packages-microsoft-prod.deb"
        dest: /tmp/packages-microsoft-prod.deb
        mode: "0644"
    - name: Register the Microsoft prod repo
      apt:
        deb: /tmp/packages-microsoft-prod.deb

    - name: Install mssql-server
      apt:
        name: mssql-server
        state: present
        update_cache: yes

    # SQL Server 2022 links OpenLDAP 2.5 (liblber-2.5); 2025 links OpenLDAP 2.6 (liblber-2.6).
    - name: Ensure the OpenLDAP runtime SQL Server needs is present
      apt:
        name: "{{ 'libldap-2.5-0' if mssql_version_eff == '2022' else 'libldap-2.6-0' }}"
        state: present
      failed_when: false   # ships by default on supported Ubuntu; start diagnostics flag it otherwise

    - name: Install mssql-tools and unixodbc-dev (sqlcmd)
      apt:
        name: [mssql-tools18, unixodbc-dev]
        state: present
      environment:
        ACCEPT_EULA: "Y"

    - name: Run mssql-conf setup (non-interactive)
      shell: |
        /opt/mssql/bin/mssql-conf -n setup accept-eula
      environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "{{ sa_password_eff }}"
        MSSQL_PID: "{{ mssql_pid_eff }}"
      args:
        creates: /var/opt/mssql/.system/instance_id

    - name: Ensure mssql-server service is enabled and started
      systemd:
        name: mssql-server
        state: started
        enabled: true
        daemon_reload: true
      register: mssql_start
      failed_when: false

    - name: Capture diagnostics if SQL Server failed to start
      when: mssql_start.status.ActiveState | default('') != 'active'
      shell: |
        echo "==== sqlservr direct run (the REAL crash reason) ===="
        timeout 10 /opt/mssql/bin/sqlservr 2>&1 | head -15 || true
        echo "==== ldd missing shared libraries ===="
        ldd /opt/mssql/bin/sqlservr 2>&1 | grep -i "not found" || echo "(no missing libs reported by ldd)"
        echo "==== OS / libldap present ===="
        echo "OS: $(. /etc/os-release; echo $PRETTY_NAME)"
        ls -1 /usr/lib/x86_64-linux-gnu/liblber-2.* /usr/lib/x86_64-linux-gnu/libldap-2.* 2>/dev/null || echo "(no liblber/libldap 2.x found)"
        echo "==== free -m ===="; free -m
        echo "==== journal (systemd loop, least useful) ===="; journalctl -xeu mssql-server.service --no-pager 2>&1 | tail -20
      register: mssql_diag
      changed_when: false

    - name: Fail with the real SQL Server start error
      when: mssql_start.status.ActiveState | default('') != 'active'
      fail:
        msg: |
          SQL Server failed to start on {{ inventory_hostname }}.
          Common causes: (1) < 2 GB RAM; (2) unsupported OS — if you see
          "liblber-2.X.so.0: cannot open shared object file":
            - SQL Server 2022 needs OpenLDAP 2.5 -> Ubuntu 20.04/22.04
            - SQL Server 2025 needs OpenLDAP 2.6 -> Ubuntu 22.04/24.04
          Ubuntu 26.04 is not supported. Rebuild on a supported Ubuntu (recommended 24.04 for 2025).
          Diagnostics:
          {{ mssql_diag.stdout }}

    - name: Wait for SQL Server to accept connections on 1433
      wait_for:
        port: 1433
        host: 127.0.0.1
        timeout: 120

    - name: Verify connectivity with sqlcmd
      shell: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "{{ sa_password_eff }}" -No
        -Q "SELECT @@VERSION"
      register: mssql_version
      changed_when: false
      failed_when: mssql_version.rc != 0

    - name: Report SQL Server status
      debug:
        msg: "SQL Server {{ mssql_version_eff }} single instance ready on {{ inventory_hostname }}:1433. {{ mssql_version.stdout_lines[0] | default('') }}"
