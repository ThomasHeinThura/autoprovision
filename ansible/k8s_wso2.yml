# Deploy WSO2 (APIM control plane + gateways, or Identity Server) as IAC.
#
# Renders the WSO2_APIM_KUBE_ISTIO repo with environment values substituted (so you NEVER
# hand-edit ConfigMaps), then kubectl apply against the target cluster. Runs on the JUMP HOST.
#
# Required: kubeconfig_path, wso2_src (repo dir), render_dir (per-cluster working copy),
#           component (apim|is), and the hostnames + DB URL to inject:
#   apim_host, internal_gw_host, external_gw_host, is_host, mssql_host
#   tls_secret (default wso2-ingress-cert)
#   logstash_host (optional — the docker ELK VM IP/host that runs Logstash on :5044; the gateway
#     filebeat sidecars ship apim_metrics.log there. Substituted only when provided.)
#
# Token substitution (exact strings only — WSO2 config keys like apim.gateway are untouched):
#   apim.example.com -> apim_host        internal-gw.example.com -> internal_gw_host
#   external-gw.example.com -> external_gw_host   wso2is.example.com -> is_host
#   <MSSQL_DB_URL> -> mssql_host          <LOGSTASH_URL> -> logstash_host (when set)

- name: Deploy WSO2 {{ component | default('?') | upper }} (IAC)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "kubectl --kubeconfig {{ kubeconfig_path }}"
    tls_secret: "{{ tls_secret | default('wso2-ingress-cert') }}"
  tasks:
    - name: Verify the cluster kubeconfig exists
      stat: { path: "{{ kubeconfig_path }}" }
      register: kc
    - name: Fail if kubeconfig missing
      fail: { msg: "kubeconfig not found at {{ kubeconfig_path }} — install the RKE2 cluster first." }
      when: not kc.stat.exists

    - name: Reset the render directory
      file: { path: "{{ render_dir }}", state: absent }
    - name: Create the render directory
      file: { path: "{{ render_dir }}", state: directory, mode: "0755" }

    - name: Copy the WSO2 repo into the render directory
      shell: "cp -a {{ wso2_src }}/. {{ render_dir }}/"

    # One physical line: a folded scalar (`>`) would turn these more-indented `-e` lines into
    # literal newlines, breaking the single `find ... -exec sed -i ... {} +` invocation.
    - name: Substitute environment values into the rendered manifests (no manual CM edits)
      shell: >-
        find {{ render_dir }} -type f \( -name '*.yaml' -o -name '*.yml' \) -exec sed -i -e 's|apim\.example\.com|{{ apim_host }}|g' -e 's|internal-gw\.example\.com|{{ internal_gw_host }}|g' -e 's|external-gw\.example\.com|{{ external_gw_host }}|g' -e 's|wso2is\.example\.com|{{ is_host }}|g' -e 's|<MSSQL_DB_URL>|{{ mssql_host }}|g' {} +

    # Only substitute the Logstash host when one is provided — otherwise leave the placeholder so a
    # half-configured ELK target doesn't silently become hosts: [":5044"]. Filebeat is a sidecar,
    # so a bad/missing target never blocks the gateway from starting.
    - name: Point the gateway filebeat sidecars at Logstash (when logstash_host is set)
      shell: >-
        find {{ render_dir }} -type f \( -name '*.yaml' -o -name '*.yml' \) -exec sed -i -e 's|<LOGSTASH_URL>|{{ logstash_host }}|g' {} +
      when: (logstash_host | default('')) | length > 0

    # Ambient: enroll each namespace in the mesh with istio.io/dataplane-mode=ambient (ztunnel L4
    # mTLS, no sidecars). Also strip any leftover istio-injection label from a prior sidecar install
    # so a stale label can't re-inject sidecars when pods are recreated.
    - name: Ensure WSO2 namespaces exist and are enrolled in the Istio ambient mesh
      shell: |
        for ns in {{ wso2_namespaces }}; do
          {{ kubectl }} create ns $ns --dry-run=client -o yaml | {{ kubectl }} apply -f -
          {{ kubectl }} label ns $ns istio-injection- --overwrite 2>/dev/null || true
          {{ kubectl }} label ns $ns istio.io/dataplane-mode=ambient --overwrite
        done
      vars:
        wso2_namespaces: "{{ 'wso2-cp wso2-internal-gw wso2-external-gw' if component == 'apim' else 'wso2-is' }}"

    # Migration cleanup: if this cluster previously ran the SIDECAR layout, the old istio
    # VirtualServices and the istio.networking Gateway still exist (kubectl apply does not prune
    # objects that were removed from the manifests). Delete them so they don't shadow the new
    # Gateway API HTTPRoutes / Gateway. Idempotent — --ignore-not-found on a clean cluster.
    # The ambient layout has NO VirtualServices, so deleting them all is safe. Only the sidecar-era
    # session-affinity DR (apim-dr in wso2-cp) is name-scoped — the new DRs (apim-backend-tls-settings
    # etc.) are reconciled in place by the apply below, so we must NOT blanket-delete DestinationRules.
    - name: Remove stale sidecar-era Istio VirtualServices + Gateway + DR (migration to ambient)
      shell: |
        for ns in {{ wso2_namespaces }}; do
          {{ kubectl }} -n $ns delete virtualservice --all --ignore-not-found
        done
        {{ kubectl }} -n wso2-cp delete destinationrule apim-dr --ignore-not-found
        {{ kubectl }} -n istio-system delete gateway.networking.istio.io wso2-gateway --ignore-not-found
      vars:
        wso2_namespaces: "{{ 'wso2-cp wso2-internal-gw wso2-external-gw' if component == 'apim' else 'wso2-is' }}"
      changed_when: false

    - name: Ensure the Istio ingress TLS secret exists (HTTPS for the WSO2 gateway)
      shell: >-
        {{ kubectl }} -n istio-system create secret tls {{ tls_secret }} --cert={{ render_dir }}/certificates/server.crt --key={{ render_dir }}/certificates/server.key --dry-run=client -o yaml | {{ kubectl }} apply -f -

    # Gateway API Gateway (gatewayClassName: istio). Istio reconciles it into an ingress proxy +
    # a LoadBalancer Service 'wso2-gateway-istio' in istio-system (MetalLB assigns the EXTERNAL-IP).
    - name: Apply the shared Gateway API Gateway (HTTPS for all WSO2 hosts)
      shell: "{{ kubectl }} apply -f {{ render_dir }}/istio-gateway.yaml"

    # ── APIM: control plane + internal/external gateways (each dir has its HTTPRoute + DR) ──
    - name: Apply WSO2 APIM components
      when: component == 'apim'
      shell: |
        {{ kubectl }} apply -f {{ render_dir }}/control-plane/
        {{ kubectl }} apply -f {{ render_dir }}/internal-gw/
        {{ kubectl }} apply -f {{ render_dir }}/external-gw/

    # ── Identity Server ──
    - name: Apply WSO2 Identity Server
      when: component == 'is'
      shell: "{{ kubectl }} apply -f {{ render_dir }}/wso2-is/"

    # Recreate the workload pods so they drop any sidecar from a prior install and are captured by
    # ztunnel under the ambient label. On a fresh install the pods are already ambient-only, so this
    # is a harmless restart. Best-effort: a not-yet-created Deployment just reports "not found".
    - name: Restart WSO2 deployments so pods join the ambient mesh (shed any old sidecar)
      shell: |
        for ns in {{ wso2_namespaces }}; do
          {{ kubectl }} -n $ns rollout restart deployment --all 2>/dev/null || true
        done
      vars:
        wso2_namespaces: "{{ 'wso2-cp wso2-internal-gw wso2-external-gw' if component == 'apim' else 'wso2-is' }}"
      changed_when: true

    - name: Report
      debug:
        msg: >-
          WSO2 {{ component | upper }} applied to the cluster with substituted hosts
          (apim={{ apim_host }}, internal-gw={{ internal_gw_host }}, external-gw={{ external_gw_host }},
          is={{ is_host }}) and MSSQL={{ mssql_host }}. Point DNS for those hosts at the Gateway API
          ingress IP — get it with: {{ kubectl }} -n istio-system get svc wso2-gateway-istio
          Check pods: {{ kubectl }} get pods -n {{ 'wso2-cp' if component == 'apim' else 'wso2-is' }}
