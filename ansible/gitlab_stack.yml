- name: Deploy GitLab stack from compose file
  hosts: docker_vm
  become: true
  vars:
    repo_url: "https://github.com/ThomasHeinThura/autoprovision.git"
    repo_root: "/home/{{ ansible_user }}/autoprovision"
    compose_dir: "{{ repo_root }}/docker"
    runner_config_dir: "{{ compose_dir }}/runner-config"
    gitlab_domain_safe: "{{ gitlab_domain | default('gitlab.example.com') }}"
    gitlab_registry_domain_safe: "{{ gitlab_registry_domain | default('registry.example.com') }}"
    gitlab_runner_token_safe: "{{ gitlab_runner_token | default('') }}"
  tasks:
    - name: Check whether repo root is a git checkout
      stat:
        path: "{{ repo_root }}/.git"
      register: repo_git_stat

    - name: Check whether repo root path exists
      stat:
        path: "{{ repo_root }}"
      register: repo_root_stat

    - name: Remove invalid repo root if it exists but is not a git checkout
      file:
        path: "{{ repo_root }}"
        state: absent
      when: repo_root_stat.stat.exists and not repo_git_stat.stat.exists

    - name: Ensure autoprovision repo is present and up to date
      become_user: "{{ ansible_user }}"
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_root }}"
        version: main
        update: yes
        force: yes

    - name: Show compose directory
      debug:
        msg: "Using compose_dir={{ compose_dir }}"

    - name: Ensure compose directory exists
      file:
        path: "{{ compose_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure GitLab runner config directory exists
      file:
        path: "{{ runner_config_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure GitLab runner system id file exists
      file:
        path: "{{ runner_config_dir }}/.runner_system_id"
        state: touch
        mode: "0644"

    - name: Seed GitLab runner config template if missing
      copy:
        dest: "{{ runner_config_dir }}/config.toml"
        mode: "0644"
        force: false
        content: |
          concurrent = 1
          check_interval = 0
          connection_max_age = "15m0s"
          shutdown_timeout = 0

          [session_server]
            session_timeout = 1800

          # Add your runner token after first GitLab UI registration.
          [[runners]]
            name = "local-docker-runner"
            url = "https://{{ gitlab_domain_safe }}"
            executor = "docker"
            [runners.cache]
              MaxUploadedArchiveSize = 0
            [runners.docker]
              tls_verify = false
              image = "alpine:latest"
              privileged = true
              disable_entrypoint_overwrite = false
              oom_kill_disable = false
              disable_cache = false
              volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache", "/etc/gitlab-runner/certs/{{ gitlab_domain_safe }}.crt:/usr/local/share/ca-certificates/local-dev-ca.crt:ro"]
              volume_keep = false
              extra_hosts = ["{{ gitlab_domain_safe }}:host-gateway", "{{ gitlab_registry_domain_safe }}:host-gateway"]
              pull_policy = ["if-not-present"]
              shm_size = 0
              network_mtu = 0

    - name: Ensure runner URL follows selected GitLab domain
      lineinfile:
        path: "{{ runner_config_dir }}/config.toml"
        regexp: '^\s*url\s*=\s*".*"\s*$'
        line: '  url = "https://{{ gitlab_domain_safe }}"'
        backrefs: false

    - name: Ensure GitLab database exists in pg-platform
      shell: |
        set -e
        if ! docker exec pg-platform psql -U platform -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='gitlab'" | grep -q 1; then
          docker exec pg-platform psql -U platform -d postgres -c "CREATE DATABASE gitlab"
        fi
      register: gitlab_db_result
      changed_when: "'CREATE DATABASE' in (gitlab_db_result.stdout | default(''))"

    - name: Pull latest GitLab images
      shell: |
        export GITLAB_DOMAIN='{{ gitlab_domain_safe }}'
        export GITLAB_REGISTRY_DOMAIN='{{ gitlab_registry_domain_safe }}'
        docker compose -f docker-compose.gitlab.yml pull
      args:
        chdir: "{{ compose_dir }}"

    - name: Bring up GitLab stack
      shell: |
        export GITLAB_DOMAIN='{{ gitlab_domain_safe }}'
        export GITLAB_REGISTRY_DOMAIN='{{ gitlab_registry_domain_safe }}'
        docker compose -f docker-compose.gitlab.yml up -d --force-recreate gitlab gitlab-runner
      args:
        chdir: "{{ compose_dir }}"

    - name: Wait for GitLab internal readiness endpoint
      shell: |
        docker exec gitlab bash -lc "curl -sS http://127.0.0.1/-/readiness | grep -q 'ok'"
      register: gitlab_readiness
      retries: 40
      delay: 15
      until: gitlab_readiness.rc == 0
      changed_when: false

    - name: Register GitLab runner when token is provided
      shell: |
        docker exec gitlab-runner gitlab-runner register \
          --non-interactive \
          --url "https://{{ gitlab_domain_safe }}" \
          --token "{{ gitlab_runner_token_safe }}" \
          --name "local-docker-runner" \
          --executor "docker" \
          --docker-image "alpine:latest" \
          --docker-privileged \
          --docker-volumes "/var/run/docker.sock:/var/run/docker.sock" \
          --docker-volumes "/cache" \
          --docker-extra-hosts "{{ gitlab_domain_safe }}:host-gateway" \
          --docker-extra-hosts "{{ gitlab_registry_domain_safe }}:host-gateway"
      when: gitlab_runner_token_safe | length > 0
      register: runner_register

    - name: Ensure runner service is restarted after registration
      shell: docker restart gitlab-runner
      when: gitlab_runner_token_safe | length > 0

    - name: Verify runner process is healthy
      shell: docker exec gitlab-runner gitlab-runner verify
      register: runner_verify
      changed_when: false
      failed_when: false

    - name: Report runner verification result
      debug:
        msg: >-
          GitLab runner verify rc={{ runner_verify.rc }}.
          {{ 'Runner is registered and reachable.' if runner_verify.rc == 0 else 'Runner is running but not verified yet. Provide gitlab_runner_token to auto-register.' }}

    - name: Report GitLab deployment complete
      debug:
        msg: "GitLab stack deployed with domain {{ gitlab_domain_safe }} and registry {{ gitlab_registry_domain_safe }}."
