- name: Bring up Docker platform stack (PostgreSQL + Dockhand)
  hosts: docker_vm
  become: true
  # Traefik is installed first by ansible/traefik_stack.yml and owns the shared
  # `platform` network this stack attaches to. Run Traefik before this play.
  vars:
    repo_url: "https://github.com/ThomasHeinThura/autoprovision.git"
    repo_root: "/home/{{ ansible_user }}/autoprovision"
    compose_dir: "{{ repo_root }}/docker"
    dockhand_domain_safe: "{{ dockhand_domain | default('dockhand.local') }}"
  tasks:
    - name: Check whether repo root is a git checkout
      stat:
        path: "{{ repo_root }}/.git"
      register: repo_git_stat

    - name: Check whether repo root path exists
      stat:
        path: "{{ repo_root }}"
      register: repo_root_stat

    - name: Remove invalid repo root if it exists but is not a git checkout
      file:
        path: "{{ repo_root }}"
        state: absent
      when: repo_root_stat.stat.exists and not repo_git_stat.stat.exists

    - name: Ensure autoprovision repo is present and up to date
      become_user: "{{ ansible_user }}"
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_root }}"
        version: main
        update: yes
        force: yes

    - name: Show compose directory
      debug:
        msg: "Using compose_dir={{ compose_dir }}"

    - name: Ensure compose directory exists
      file:
        path: "{{ compose_dir }}"
        state: directory
        mode: "0755"

    - name: Pull latest platform images (Postgres, Dockhand)
      shell: |
        export DOCKHAND_DOMAIN='{{ dockhand_domain_safe }}'
        docker compose -f docker-compose.platform.yml pull
      args:
        chdir: "{{ compose_dir }}"

    - name: Bring up platform stack (PostgreSQL + Dockhand)
      shell: |
        export DOCKHAND_DOMAIN='{{ dockhand_domain_safe }}'
        docker compose -f docker-compose.platform.yml up -d --force-recreate
      args:
        chdir: "{{ compose_dir }}"

    - name: Wait for Postgres to be healthy
      shell: >
        docker inspect --format='{{"{{"}}.State.Health.Status{{"}}"}}' pg-platform
      register: pg_health
      until: pg_health.stdout == "healthy"
      retries: 20
      delay: 5
      changed_when: false

    - name: Report Postgres health status
      debug:
        msg: "Postgres health: {{ pg_health.stdout }}"
