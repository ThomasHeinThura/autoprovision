# Generate a long-lived WSO2 keystore + truststore and publish them as a Kubernetes Secret.
#
# WHY THIS EXISTS:
#   The stock WSO2 image ships the DEMO primary keystore (wso2carbon.jks, alias/pass "wso2carbon").
#   Its private key is public knowledge (it's in every WSO2 distribution + on GitHub), so anyone can
#   forge the JWT access tokens our gateways sign and validate with it. This playbook replaces that
#   demo key with a freshly generated, long-lived key WE control — WITHOUT rotating it on a timer
#   (the same key signs tokens and backs the secure vault, so casual rotation breaks token
#   validation and secret decryption). Rotate it deliberately during a maintenance window, not here.
#
#   Scope: this is the WSO2 *internal* keystore only. It is NOT the public TLS cert — that lives at
#   the Istio shared Gateway (secret wso2-ingress-cert, managed by k8s_cert.yml) and should be the
#   customer's well-known cert. Since TLS terminates at the mesh, this keystore is never shown to an
#   external client; it only signs tokens, encrypts the secure vault, and identifies WSO2 nodes to
#   each other. So it can (and should) be self-signed and long-lived.
#
# HOW THE KEYSTORE REACHES THE CONTAINER (no image rebuild, version-independent):
#   The WSO2 entrypoint copies everything under /home/wso2carbon/wso2-config-volume/ over the server
#   home at startup — that's how deployment.toml already gets in. The deployment manifests mount this
#   Secret's two files at
#     /home/wso2carbon/wso2-config-volume/repository/resources/security/wso2carbon.jks
#     /home/wso2carbon/wso2-config-volume/repository/resources/security/client-truststore.jks
#   so they overwrite the demo keystores in repository/resources/security/ on boot.
#
# DEFAULTS = DROP-IN: alias and passwords default to "wso2carbon", so [keystore.tls]/[truststore]
#   in the ConfigMaps need NO change — only the file content changes. If you override the passwords
#   or alias below, you MUST also update [keystore.tls] (password, key_password, alias) and
#   [truststore] (password) in the cm-*.yaml of every component, then re-run k8s_wso2.yml.
#
# IDEMPOTENT: the .jks files are generated once (guarded by `creates:`). Re-running only re-applies
#   the Secret from the existing files — it will NOT mint a new key (that would invalidate every
#   live token). Delete out_dir/*.jks by hand if you truly intend to roll a new key.
#
# Runs on the JUMP HOST (localhost). Requires `keytool` (any JDK/JRE) on the jump host.
#
# Required variables:
#   kubeconfig_path  path to the target cluster's kubeconfig on the jump host
# Optional variables (sensible defaults):
#   namespace        space/comma/newline list of namespaces to publish the Secret into
#                    (default: the three APIM namespaces; for IS pass "wso2-is")
#   keystore_secret  Secret name the deployments mount (default: wso2-keystore)
#   out_dir          where the generated .jks files are kept on the jump host
#   key_alias        key alias            (default: wso2carbon — keep unless you also edit the CMs)
#   keystore_password / key_password / truststore_password
#                    store + key passwords (default: wso2carbon — keep unless you also edit the CMs)
#   validity_days    keystore validity    (default: 3650 ≈ 10 years)
#   key_dname        X.500 subject DN     (default below)
#   key_san          keytool SAN list     (default below; covers the in-cluster service names)
#   extra_ca_certs   space/comma list of PEM files to ALSO trust in the truststore (e.g. a backend
#                    or public CA WSO2 must call over TLS). The new key's own cert is always added.

- name: Generate WSO2 keystore + truststore and publish as a Secret
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "kubectl --kubeconfig {{ kubeconfig_path }}"
    namespaces_list: "{{ (namespace | default('wso2-cp wso2-internal-gw wso2-external-gw')).replace(',', ' ').split() }}"
    keystore_secret: "{{ keystore_secret | default('wso2-keystore') }}"
    out_dir: "{{ out_dir | default(playbook_dir ~ '/../data/wso2-keystore') }}"
    key_alias: "{{ key_alias | default('wso2carbon') }}"
    keystore_password: "{{ keystore_password | default('wso2carbon') }}"
    key_password: "{{ key_password | default(keystore_password | default('wso2carbon')) }}"
    truststore_password: "{{ truststore_password | default('wso2carbon') }}"
    validity_days: "{{ validity_days | default(3650) }}"
    key_dname: "{{ key_dname | default('CN=wso2carbon,OU=WSO2,O=WSO2,L=Mountain View,ST=CA,C=US') }}"
    key_san: "{{ key_san | default('dns:localhost,dns:*.wso2-cp,dns:*.wso2-internal-gw,dns:*.wso2-external-gw,dns:*.wso2-is') }}"
    extra_ca_list: "{{ (extra_ca_certs | default('')).replace(',', ' ').split() }}"
    keystore_file: "{{ out_dir }}/wso2carbon.jks"
    truststore_file: "{{ out_dir }}/client-truststore.jks"
    cert_file: "{{ out_dir }}/wso2carbon.crt"
  tasks:
    - name: Verify the cluster kubeconfig exists
      stat: { path: "{{ kubeconfig_path }}" }
      register: kc
    - name: Fail clearly if the kubeconfig is missing
      fail:
        msg: >-
          kubeconfig not found at {{ kubeconfig_path }}. Install the RKE2 cluster first
          (the RKE2 workload fetches it to data/k8s/<cluster>/kubeconfig).
      when: not kc.stat.exists

    - name: Verify keytool is available on the jump host
      shell: "command -v keytool"
      register: keytool_bin
      changed_when: false
      failed_when: keytool_bin.rc != 0

    - name: Verify the cluster is reachable
      shell: "{{ kubectl }} version --request-timeout=15s >/dev/null 2>&1"
      register: reachable
      changed_when: false
      failed_when: reachable.rc != 0

    - name: Ensure the output directory exists
      file: { path: "{{ out_dir }}", state: directory, mode: "0700" }

    - name: Check whether the keystore already exists (idempotent — never re-mint a live key)
      stat: { path: "{{ keystore_file }}" }
      register: ks

    # ── Generate the long-lived keystore (only when missing) ──
    # `shell: |` keeps each line a separate command; backslash-continuations are real shell line
    # joins (NOT the folded-scalar `>` trap that silently splits one command across lines).
    - name: Generate the long-lived keystore with keytool
      shell: |
        keytool -genkeypair -alias "{{ key_alias }}" -keyalg RSA -keysize 2048 \
          -sigalg SHA256withRSA -validity "{{ validity_days }}" \
          -keystore "{{ keystore_file }}" -storetype JKS \
          -storepass "{{ keystore_password }}" -keypass "{{ key_password }}" \
          -dname "{{ key_dname }}" -ext "SAN={{ key_san }}"
      when: not ks.stat.exists

    - name: Export the keystore's public certificate (for the truststore)
      shell: |
        keytool -exportcert -rfc -alias "{{ key_alias }}" \
          -keystore "{{ keystore_file }}" -storepass "{{ keystore_password }}" \
          -file "{{ cert_file }}"
      args:
        creates: "{{ cert_file }}"

    # ── Build the truststore: trust OUR new cert + any extra CAs the operator supplies ──
    # We build fresh (not from the image's default truststore) on purpose: the default trusted the
    # OLD demo cert, which we've just replaced. WSO2's outbound TLS in this mesh-native layout is
    # almost entirely node-to-node (service_url https://...:9443) — covered by trusting our own cert.
    # If WSO2 must call a PUBLIC https endpoint, pass that CA via extra_ca_certs.
    - name: Import the new public cert into the truststore
      shell: |
        keytool -importcert -noprompt -alias "{{ key_alias }}" \
          -file "{{ cert_file }}" -keystore "{{ truststore_file }}" \
          -storetype JKS -storepass "{{ truststore_password }}"
      args:
        creates: "{{ truststore_file }}"

    - name: Import any extra CA certificates into the truststore
      shell: |
        keytool -importcert -noprompt -alias "extra-ca-{{ idx }}" \
          -file "{{ ca }}" -keystore "{{ truststore_file }}" \
          -storetype JKS -storepass "{{ truststore_password }}" 2>/dev/null || true
      loop: "{{ extra_ca_list }}"
      loop_control: { loop_var: ca, index_var: idx }
      when: extra_ca_list | length > 0
      changed_when: true

    # ── Publish both stores as a Secret in every target namespace ──
    - name: Ensure each target namespace exists
      shell: >-
        {{ kubectl }} create namespace {{ ns }} --dry-run=client -o yaml | {{ kubectl }} apply -f -
      loop: "{{ namespaces_list }}"
      loop_control: { loop_var: ns }
      register: ns_apply
      changed_when: "'created' in ns_apply.stdout"

    # One physical line: a folded scalar (`>`) would split the --from-file flags across newlines and
    # break `create secret generic` (see the repo's k8s_cert.yml note on the same trap).
    - name: Create or update the keystore Secret in each namespace
      shell: >-
        {{ kubectl }} -n {{ ns }} create secret generic {{ keystore_secret }} --from-file=wso2carbon.jks={{ keystore_file }} --from-file=client-truststore.jks={{ truststore_file }} --dry-run=client -o yaml | {{ kubectl }} apply -f -
      loop: "{{ namespaces_list }}"
      loop_control: { loop_var: ns }
      register: secret_apply
      changed_when: "'configured' in secret_apply.stdout or 'created' in secret_apply.stdout"

    - name: Report
      debug:
        msg: >-
          Secret '{{ keystore_secret }}' (wso2carbon.jks + client-truststore.jks) published to
          {{ namespaces_list }}. Keystore: alias='{{ key_alias }}', validity={{ validity_days }}d,
          file kept at {{ keystore_file }} on the jump host (back it up — it is NOT in git and is the
          ONLY copy of the signing key). The deployments mount it over the demo keystore via the
          wso2-config-volume; run/re-run k8s_wso2.yml (or `kubectl rollout restart`) so pods pick it
          up. Passwords/alias are at WSO2 defaults unless overridden — if you changed them, update
          [keystore.tls] and [truststore] in every cm-*.yaml before the rollout.
