# SQL Server 2025 Enterprise — 3-node High-Availability Availability Group on Ubuntu (IAC).
# (Version + Ubuntu repo are selectable; defaults to SQL Server 2025 on Ubuntu 24.04 — a
#  Microsoft-supported combination. SQL Server 2025 links OpenLDAP 2.6; 2022 links 2.5.)
#
# Follows the official Microsoft procedure (curated in mssql/ + sql-docs/):
#   - mssql/mssql-install.md
#   - mssql/availability-groups-configure.md            (CREATE AG ... CLUSTER_TYPE = EXTERNAL)
#   - sql-docs/.../includes/cluster-availability-group-create-prereq.md  (cert/endpoint/hadr)
#   - sql-docs/.../sql-server-linux-availability-group-cluster-pacemaker.md (Ubuntu/Pacemaker)
#
# This is a TRUE HA AG: 3 SYNCHRONOUS replicas, CLUSTER_TYPE = EXTERNAL, FAILOVER_MODE = EXTERNAL,
# managed by Pacemaker/Corosync with automatic failover + a virtual IP. (Read-scale CLUSTER_TYPE=NONE
# is NOT used here.) Target inventory group: [mssql_ag]; the FIRST host is the initial primary.
#
# Required: sa_password. Optional: db_admin_user + db_admin_password (a NAMED sysadmin login — sa
#   still installs the instance and creates this login on every node, then Phases 2–10 run their SQL
#   as it; leave blank to use sa for everything). Also: ag_name (ag1), mssql_pid (Enterprise), endpoint_port (5022),
#   listener_ip (virtual IP for the AG — recommended), mssql_version (2025), ubuntu_release (24.04),
#   pacemaker_password / hacluster_password / cert_password / master_key_password (derived if unset),
#   enable_fencing (default false — LAB ONLY; production MUST configure a real fencing/STONITH device),
#   listener_name (<ag>-listener), listener_port (1433), listener_subnet_mask
#     (auto: 0.0.0.0 for SQL 2022/2025, 255.255.255.255 for 2017/2019 — the listener IP is owned by
#      the Pacemaker VIP, so this is metadata only). The listener is created only when listener_ip is set.
#   mssql_memory_limit_mb (default 70% of node RAM) — SQL Server memory cap; prevents OOM/D-Bus loss
#     during the first hadr-enabled restart on small VMs. mssql_start_timeout (default 1800s) — how
#     long to wait for SQL to accept connections after the restart before failing with diagnostics.
#
# Node names: the SQL replica name must equal SERVERPROPERTY('ServerName') (= the node hostname,
# <=15 chars, unique). Endpoint URLs use node IPs so they resolve regardless of /etc/hosts.

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 1 — Install SQL Server + tools, enable Always On, prep host (all nodes)
# ════════════════════════════════════════════════════════════════════════════════
- name: SQL Server install + Always On prep (all AG nodes)
  hosts: mssql_ag
  become: true
  gather_facts: true
  vars:
    sa_password_eff: "{{ sa_password | default('') }}"
    mssql_pid_eff: "{{ mssql_pid | default('Enterprise') }}"
    mssql_version_eff: "{{ mssql_version | default('2025') }}"
    ubuntu_release_eff: "{{ ubuntu_release | default('24.04') }}"
    pacemaker_password_eff: "{{ pacemaker_password | default((ag_name | default('ag1')) ~ '-Pacemaker-Pa55!') }}"
    endpoint_port_eff: "{{ endpoint_port | default(5022) }}"
    # Phase 1 ALWAYS uses sa: this play installs SQL Server and CREATES the optional named admin
    # login (below). The named login can't authenticate until it exists, so bootstrap as sa here.
    sqlcmd: '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "{{ sa_password_eff }}" -C'
  tasks:
    - name: Fail early if SA password is not provided
      fail: { msg: "sa_password is required (strong password)." }
      when: sa_password_eff | length == 0

    # The web UI only sends db_admin_user/password as a pair, but a CLI run can pass one without
    # the other — the login would never be created and every later phase would fail confusingly.
    - name: Fail early if db_admin_user is set without db_admin_password (or vice versa)
      fail:
        msg: "db_admin_user and db_admin_password must BOTH be set (or both left empty to use sa)."
      when: >-
        ((db_admin_user | default('')) | length > 0) != ((db_admin_password | default('')) | length > 0)

    - name: Require >= 2 GB RAM
      assert:
        that: ansible_facts['memtotal_mb'] | int >= 1900
        fail_msg: "SQL Server needs >= 2 GB RAM; {{ inventory_hostname }} has {{ ansible_facts['memtotal_mb'] }} MB."
        success_msg: "Memory OK ({{ ansible_facts['memtotal_mb'] }} MB)."

    - name: Check SQL Server OS support (WARN only — does not fail)
      vars:
        supported_releases: "{{ ['20.04','22.04'] if mssql_version_eff == '2022' else ['22.04','24.04'] }}"
      debug:
        msg: >-
          {{ ('OS supported: ' ~ ansible_facts['distribution'] ~ ' ' ~ ansible_facts['distribution_version']
              ~ ' for SQL Server ' ~ mssql_version_eff)
             if (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] in supported_releases)
             else ('WARNING: ' ~ ansible_facts['distribution'] ~ ' ' ~ ansible_facts['distribution_version'] ~
                   ' is NOT a SQL Server ' ~ mssql_version_eff ~ ' supported OS (Ubuntu ' ~ (supported_releases | join('/')) ~
                   '). Continuing anyway — SQL Server may fail to start due to a missing OpenLDAP runtime; the real '
                   ~ 'start error (sqlservr/ldd) is surfaced below if it fails. Use a supported Ubuntu release.') }}

    # Some mirrors / caching proxies corrupt .deb downloads with HTTP pipelining, causing the
    # intermittent "Hash Sum mismatch" / "incorrect response from server/proxy" failures seen when
    # fetching unixodbc/msodbcsql. Turn pipelining + proxy caching off so each package is re-fetched
    # fresh and re-verified. (All the apt installs below also retry to ride out transient mirror hiccups.)
    - name: Harden apt against caching-proxy "Hash Sum mismatch" (disable pipelining + cache)
      copy:
        dest: /etc/apt/apt.conf.d/99-autoprovision-no-pipeline
        mode: "0644"
        content: |
          Acquire::http::Pipeline-Depth "0";
          Acquire::http::No-Cache "true";
          Acquire::BrokenProxy "true";

    - name: Install prerequisites
      apt:
        {
          name: [curl, gnupg, apt-transport-https, ca-certificates, ufw],
          state: present,
          update_cache: yes,
        }
      register: r_prereq
      retries: 3
      delay: 15
      until: r_prereq is succeeded

    - name: Add Microsoft GPG key
      get_url:
        {
          url: "https://packages.microsoft.com/keys/microsoft.asc",
          dest: /etc/apt/trusted.gpg.d/microsoft.asc,
          mode: "0644",
        }

    - name: Add the SQL Server {{ mssql_version_eff }} engine apt repository
      get_url:
        url: "https://packages.microsoft.com/config/ubuntu/{{ ubuntu_release_eff }}/mssql-server-{{ mssql_version_eff }}.list"
        dest: "/etc/apt/sources.list.d/mssql-server-{{ mssql_version_eff }}.list"
        mode: "0644"

    # The Microsoft "prod" repo (mssql-tools18, etc.) is registered via packages-microsoft-prod.deb
    # on 24.04 (no prod.list is published there); the .deb also works on 22.04. Engine repo above is separate.
    - name: Download packages-microsoft-prod.deb (tools/prod repo)
      get_url:
        url: "https://packages.microsoft.com/config/ubuntu/{{ ubuntu_release_eff }}/packages-microsoft-prod.deb"
        dest: /tmp/packages-microsoft-prod.deb
        mode: "0644"
    - name: Register the Microsoft prod repo
      apt: { deb: /tmp/packages-microsoft-prod.deb }

    - name: Install mssql-server
      apt: { name: mssql-server, state: present, update_cache: yes }
      register: r_mssql
      retries: 3
      delay: 15
      until: r_mssql is succeeded

    # SQL Server 2022 links OpenLDAP 2.5 (liblber-2.5); 2025 links OpenLDAP 2.6 (liblber-2.6).
    # The matching runtime ships by default on the supported Ubuntu release; install best-effort.
    - name: Ensure the OpenLDAP runtime SQL Server needs is present
      apt:
        {
          name: "{{ 'libldap-2.5-0' if mssql_version_eff == '2022' else 'libldap-2.6-0' }}",
          state: present,
        }
      failed_when: false

    - name: Install mssql-tools18 + unixodbc-dev (sqlcmd)
      apt:
        {
          name: [mssql-tools18, unixodbc-dev],
          state: present,
          update_cache: yes,
        }
      environment: { ACCEPT_EULA: "Y" }
      register: r_tools
      retries: 3
      delay: 15
      until: r_tools is succeeded

    # `mssql-conf setup` starts its OWN sqlservr to initialize the system DBs and fails with
    # "Another instance of the application is already running" if one is up. A truly fresh install
    # leaves the service stopped, but a re-used/snapshot node may have mssql-server enabled and
    # running (uninitialized) — so stop it and clear any stray sqlservr before setup. Only matters
    # when setup actually runs (instance_id absent); harmless otherwise (hadr restart starts it again).
    - name: Stop SQL Server + clear any stray sqlservr before initial setup
      shell: |
        systemctl stop mssql-server 2>/dev/null || true
        pkill -9 -x sqlservr 2>/dev/null || true
        sleep 2
        exit 0
      changed_when: false

    - name: Run mssql-conf setup (non-interactive, Enterprise edition)
      shell: /opt/mssql/bin/mssql-conf -n setup accept-eula
      environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "{{ sa_password_eff }}"
        MSSQL_PID: "{{ mssql_pid_eff }}"
      args: { creates: /var/opt/mssql/.system/instance_id }

    - name: Enable Always On availability groups (hadr)
      shell: /opt/mssql/bin/mssql-conf set hadr.hadrenabled 1
      register: hadr
      changed_when: hadr.rc == 0

    # Cap SQL Server's memory. By default SQL grabs ~80% of RAM; on small VMs the first
    # hadr-enabled start (which rebuilds model_replicatedmaster) then spikes, the box swaps itself
    # unresponsive (SSH drops → "UNREACHABLE") or OOMs (kills D-Bus → "D-Bus connection terminated").
    # 60% leaves real headroom for the OS, Pacemaker/Corosync, and the ssh/python ansible needs.
    - name: Cap SQL Server memory to leave OS headroom (prevents swap-storm/OOM on small VMs)
      shell: /opt/mssql/bin/mssql-conf set memory.memorylimitmb {{ mssql_memory_limit_mb | default((ansible_facts['memtotal_mb'] * 0.6) | int) }}
      changed_when: true

    # Disable systemd's start rate-limit for mssql-server. A few failed first-starts otherwise trip
    # "Start request repeated too quickly", after which systemctl REFUSES to start it until a manual
    # `systemctl reset-failed` — that's the "it fails a lot / I have to kill it by hand" loop.
    - name: Ensure the mssql-server systemd drop-in directory exists
      file:
        path: /etc/systemd/system/mssql-server.service.d
        state: directory
        mode: "0755"

    - name: Disable systemd start rate-limit for mssql-server (no "repeated too quickly" dead-end)
      copy:
        dest: /etc/systemd/system/mssql-server.service.d/10-no-startlimit.conf
        mode: "0644"
        content: |
          [Unit]
          StartLimitIntervalSec=0
      register: sl_dropin

    # SQL Server 2025's FIRST hadr-enabled start does a slow one-time model_replicatedmaster build.
    # Two hard-won robustness rules:
    #  (1) Restart NON-BLOCKING (`systemctl restart --no-block`). The systemd module / plain
    #      `systemctl restart` wait synchronously on D-Bus; on a small VM that wait gets reset
    #      ("D-Bus connection terminated"), failing the task and leaving the box needing a manual kill.
    #  (2) Probe readiness from the CONTROLLER (jump host) against the node's 1433 — NOT on the node.
    #      During the rebuild the node can swap so hard it drops its ssh control connection
    #      ("UNREACHABLE"); a controller-side TCP probe rides straight through that. We open 1433 +
    #      reset-failed first so the probe can connect and systemd will actually (re)start the unit.
    - name: Bring SQL Server up after enabling hadr (non-blocking restart + controller-side probe)
      block:
        - name: Reload systemd, allow 1433 for the controller probe, clear any start rate-limit
          shell: |
            systemctl daemon-reload
            (command -v ufw >/dev/null && ufw allow 1433/tcp) 2>/dev/null || true
            systemctl reset-failed mssql-server 2>/dev/null || true
            systemctl enable mssql-server 2>/dev/null || true
            exit 0
          changed_when: false
        - name: Restart SQL Server (non-blocking — readiness handled by the probe below)
          shell: |
            systemctl reset-failed mssql-server 2>/dev/null || true
            systemctl restart --no-block mssql-server
          changed_when: true
        - name: Wait for SQL Server to accept connections on 1433 (probed from the controller, survives node ssh blips)
          wait_for:
            host: "{{ inventory_hostname }}"
            port: 1433
            timeout: "{{ mssql_start_timeout | default(1800) }}"
          delegate_to: localhost
          # This probe runs on the JUMP HOST, not the SQL node. The play sets become:true for the
          # remote nodes, but a TCP port probe needs no privileges — and sudo on the jump host may
          # require a password (failing with "sudo: a password is required"). Never become here.
          become: false
        - name: Confirm the engine answers a query (node is responsive again once SQL is up)
          shell: '{{ sqlcmd }} -l 5 -Q "SELECT 1;"'
          register: mssql_select1
          changed_when: false
          retries: 30
          delay: 10
          until: mssql_select1.rc == 0
      rescue:
        # Read the truth from the SQL errorlog — do NOT run sqlservr directly (that would start a
        # second first-init and leave a stray process). The errorlog states the real failure.
        - name: Capture the real start error from the SQL errorlog
          shell: |
            echo "== unit status =="
            systemctl is-active mssql-server || true
            systemctl --no-pager -l status mssql-server 2>&1 | tail -10 || true
            echo "== /var/opt/mssql/log/errorlog (tail 40) =="
            tail -n 40 /var/opt/mssql/log/errorlog 2>/dev/null || echo "(no errorlog yet)"
            echo "== ldd missing shared libraries =="
            ldd /opt/mssql/bin/sqlservr 2>&1 | grep -i "not found" || echo "(no missing libs reported by ldd)"
            echo "== OS / libldap present =="
            echo "OS: $(. /etc/os-release; echo $PRETTY_NAME)"
            ls -1 /usr/lib/x86_64-linux-gnu/liblber-2.* /usr/lib/x86_64-linux-gnu/libldap-2.* 2>/dev/null || echo "(no liblber/libldap 2.x found)"
          register: mssql_diag
          changed_when: false
        - name: Fail with the real start error
          fail:
            msg: |
              SQL Server {{ mssql_version_eff }} did not accept connections on {{ inventory_hostname }} within {{ mssql_start_timeout | default(1800) }}s.
              If you see "liblber-2.X.so.0: cannot open shared object file", the OS is unsupported:
                - SQL Server 2022 needs OpenLDAP 2.5  -> Ubuntu 20.04 / 22.04
                - SQL Server 2025 needs OpenLDAP 2.6  -> Ubuntu 22.04 / 24.04
              Ubuntu 26.04 is not supported by any SQL Server release. Rebuild this node on a supported
              Ubuntu (recommended: 24.04 for SQL Server 2025).
              {{ mssql_diag.stdout }}

    - name: Enable AlwaysOn_health extended event session
      shell: '{{ sqlcmd }} -Q "ALTER EVENT SESSION AlwaysOn_health ON SERVER WITH (STARTUP_STATE=ON);"'
      changed_when: false
      failed_when: false

    - name: Add all AG nodes to /etc/hosts (name resolution between replicas)
      blockinfile:
        path: /etc/hosts
        marker: "# {mark} MSSQL AG NODES"
        block: |
          {% for h in groups['mssql_ag'] %}
          {{ h }} {{ hostvars[h].ansible_facts.hostname }}
          {% endfor %}

    # Ubuntu ships a `127.0.1.1 <hostname>` line. corosync resolves its ring0_addr (the node name)
    # through /etc/hosts and that loopback line wins — so corosync binds the cluster link to
    # 127.0.1.1 and every node can only see itself (split-brain, no quorum). Remove it so the node
    # name resolves to the real LAN IP added above. (127.0.0.1 localhost is untouched.)
    - name: Remove the Ubuntu 127.0.1.1 loopback hostname mapping (corosync must bind the LAN IP)
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        state: absent

    # Persist it: without this, cloud-init rewrites /etc/hosts on the next reboot and re-adds the
    # 127.0.1.1 line → corosync rebinds loopback → split-brain returns after a node reboot.
    - name: Stop cloud-init from rewriting /etc/hosts on reboot (durable corosync fix)
      copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-etc-hosts.cfg
        content: "manage_etc_hosts: false\n"
        mode: "0644"
      failed_when: false

    - name: Open firewall ports (Pacemaker, SQL, AG endpoint)
      shell: |
        ufw allow 2224/tcp; ufw allow 3121/tcp; ufw allow 21064/tcp
        ufw allow 5404/udp; ufw allow 5405/udp
        ufw allow 1433/tcp; ufw allow {{ endpoint_port_eff }}/tcp; ufw reload || true
      failed_when: false
      changed_when: false

    - name: Create the Pacemaker SQL login on every instance
      shell: >
        {{ sqlcmd }} -Q
        "IF SUSER_ID('pacemakerLogin') IS NULL CREATE LOGIN [pacemakerLogin] WITH PASSWORD = N'{{ pacemaker_password_eff }}';
         IF IS_SRVROLEMEMBER('sysadmin','pacemakerLogin') = 0 ALTER SERVER ROLE [sysadmin] ADD MEMBER [pacemakerLogin];"
      changed_when: false

    # Optional named sysadmin (web UI db_admin_user/db_admin_password). sa creates it as a sysadmin
    # on EVERY node here so the later phases can connect as it. CHECK_POLICY=OFF so a lab password
    # isn't rejected by the OS policy. Skipped when no db_admin_user is given (everything stays sa).
    - name: Create the named SQL admin login (sysadmin) on every instance — sa bootstraps it
      shell: >
        {{ sqlcmd }} -Q
        "IF SUSER_ID('{{ db_admin_user }}') IS NULL CREATE LOGIN [{{ db_admin_user }}] WITH PASSWORD = N'{{ db_admin_password }}', CHECK_POLICY = OFF;
         IF IS_SRVROLEMEMBER('sysadmin','{{ db_admin_user }}') = 0 ALTER SERVER ROLE [sysadmin] ADD MEMBER [{{ db_admin_user }}];"
      when:
        - (db_admin_user | default('')) | length > 0
        - db_admin_user != 'sa'
      no_log: true
      changed_when: false

    - name: Save the Pacemaker login credentials for the resource agent
      copy:
        dest: /var/opt/mssql/secrets/passwd
        owner: root
        group: root
        mode: "0400"
        content: |
          pacemakerLogin
          {{ pacemaker_password_eff }}

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 2 — Certificate on the PRIMARY (mirroring endpoint auth)
# ════════════════════════════════════════════════════════════════════════════════
- name: AG certificate on the primary
  hosts: mssql_ag[0]
  become: true
  gather_facts: false
  vars:
    sa_password_eff: "{{ sa_password | default('') }}"
    ag_name_eff: "{{ ag_name | default('ag1') }}"
    master_key_password_eff: "{{ master_key_password | default((ag_name | default('ag1')) ~ '-Master-Pa55!') }}"
    cert_password_eff: "{{ cert_password | default((ag_name | default('ag1')) ~ '-Cert-Pa55!') }}"
    # Use the named sysadmin login when db_admin_user is provided (created in Phase 1 by sa);
    # otherwise fall back to sa. Both must be set in the web UI for the named login to take effect.
    sqlcmd: '/opt/mssql-tools18/bin/sqlcmd -S localhost -U {{ (db_admin_user | default('''')) | ternary(db_admin_user | default(''''), ''sa'') }} -P "{{ (db_admin_user | default('''')) | ternary(db_admin_password | default(''''), sa_password | default('''')) }}" -C'
  tasks:
    - name: Create master key + certificate
      shell: >
        {{ sqlcmd }} -Q
        "IF NOT EXISTS (SELECT 1 FROM sys.symmetric_keys WHERE name='##MS_DatabaseMasterKey##')
           CREATE MASTER KEY ENCRYPTION BY PASSWORD = '{{ master_key_password_eff }}';
         IF NOT EXISTS (SELECT 1 FROM sys.certificates WHERE name='dbm_certificate')
           CREATE CERTIFICATE dbm_certificate WITH SUBJECT = 'dbm';"
      changed_when: false

    - name: Back up the certificate + private key
      shell: >
        {{ sqlcmd }} -Q
        "BACKUP CERTIFICATE dbm_certificate TO FILE = '/var/opt/mssql/data/dbm_certificate.cer'
         WITH PRIVATE KEY (FILE = '/var/opt/mssql/data/dbm_certificate.pvk',
         ENCRYPTION BY PASSWORD = '{{ cert_password_eff }}');"
      args: { creates: /var/opt/mssql/data/dbm_certificate.cer }

    - name: Fetch certificate files to the jump host
      fetch:
        {
          src: "/var/opt/mssql/data/{{ item }}",
          dest: "/tmp/mssql-ag-{{ ag_name_eff }}/{{ item }}",
          flat: true,
        }
      loop: [dbm_certificate.cer, dbm_certificate.pvk]

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 3 — Restore certificate on SECONDARIES
# ════════════════════════════════════════════════════════════════════════════════
- name: AG certificate on the secondaries
  hosts: mssql_ag[1:]
  become: true
  gather_facts: false
  vars:
    sa_password_eff: "{{ sa_password | default('') }}"
    ag_name_eff: "{{ ag_name | default('ag1') }}"
    master_key_password_eff: "{{ master_key_password | default((ag_name | default('ag1')) ~ '-Master-Pa55!') }}"
    cert_password_eff: "{{ cert_password | default((ag_name | default('ag1')) ~ '-Cert-Pa55!') }}"
    # Use the named sysadmin login when db_admin_user is provided (created in Phase 1 by sa);
    # otherwise fall back to sa. Both must be set in the web UI for the named login to take effect.
    sqlcmd: '/opt/mssql-tools18/bin/sqlcmd -S localhost -U {{ (db_admin_user | default('''')) | ternary(db_admin_user | default(''''), ''sa'') }} -P "{{ (db_admin_user | default('''')) | ternary(db_admin_password | default(''''), sa_password | default('''')) }}" -C'
  tasks:
    - name: Copy certificate files to the secondary
      copy:
        {
          src: "/tmp/mssql-ag-{{ ag_name_eff }}/{{ item }}",
          dest: "/var/opt/mssql/data/{{ item }}",
          owner: mssql,
          group: mssql,
          mode: "0660",
        }
      loop: [dbm_certificate.cer, dbm_certificate.pvk]

    - name: Create master key + restore certificate
      shell: >
        {{ sqlcmd }} -Q
        "IF NOT EXISTS (SELECT 1 FROM sys.symmetric_keys WHERE name='##MS_DatabaseMasterKey##')
           CREATE MASTER KEY ENCRYPTION BY PASSWORD = '{{ master_key_password_eff }}';
         IF NOT EXISTS (SELECT 1 FROM sys.certificates WHERE name='dbm_certificate')
           CREATE CERTIFICATE dbm_certificate FROM FILE = '/var/opt/mssql/data/dbm_certificate.cer'
             WITH PRIVATE KEY (FILE = '/var/opt/mssql/data/dbm_certificate.pvk',
               DECRYPTION BY PASSWORD = '{{ cert_password_eff }}');"
      changed_when: false

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 4 — Database mirroring endpoint on ALL nodes
# ════════════════════════════════════════════════════════════════════════════════
- name: Hadr mirroring endpoint (all nodes)
  hosts: mssql_ag
  become: true
  gather_facts: false
  vars:
    sa_password_eff: "{{ sa_password | default('') }}"
    endpoint_port_eff: "{{ endpoint_port | default(5022) }}"
    # Use the named sysadmin login when db_admin_user is provided (created in Phase 1 by sa);
    # otherwise fall back to sa. Both must be set in the web UI for the named login to take effect.
    sqlcmd: '/opt/mssql-tools18/bin/sqlcmd -S localhost -U {{ (db_admin_user | default('''')) | ternary(db_admin_user | default(''''), ''sa'') }} -P "{{ (db_admin_user | default('''')) | ternary(db_admin_password | default(''''), sa_password | default('''')) }}" -C'
  tasks:
    - name: Create + start the Hadr_endpoint (certificate auth)
      shell: >
        {{ sqlcmd }} -Q
        "IF NOT EXISTS (SELECT 1 FROM sys.endpoints WHERE name='Hadr_endpoint')
         CREATE ENDPOINT [Hadr_endpoint] AS TCP (LISTENER_PORT = {{ endpoint_port_eff }})
           FOR DATABASE_MIRRORING (ROLE = ALL, AUTHENTICATION = CERTIFICATE dbm_certificate,
             ENCRYPTION = REQUIRED ALGORITHM AES);
         ALTER ENDPOINT [Hadr_endpoint] STATE = STARTED;"
      changed_when: false

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 5 — Create the AG (CLUSTER_TYPE = EXTERNAL, 3 synchronous replicas) on primary
# ════════════════════════════════════════════════════════════════════════════════
- name: Create the Availability Group (EXTERNAL) on the primary
  hosts: mssql_ag[0]
  become: true
  gather_facts: false
  vars:
    sa_password_eff: "{{ sa_password | default('') }}"
    ag_name_eff: "{{ ag_name | default('ag1') }}"
    endpoint_port_eff: "{{ endpoint_port | default(5022) }}"
    # Use the named sysadmin login when db_admin_user is provided (created in Phase 1 by sa);
    # otherwise fall back to sa. Both must be set in the web UI for the named login to take effect.
    sqlcmd: '/opt/mssql-tools18/bin/sqlcmd -S localhost -U {{ (db_admin_user | default('''')) | ternary(db_admin_user | default(''''), ''sa'') }} -P "{{ (db_admin_user | default('''')) | ternary(db_admin_password | default(''''), sa_password | default('''')) }}" -C'
  tasks:
    - name: Build FOR REPLICA ON clause (replica name = node hostname; endpoint = node IP)
      set_fact:
        replica_clause: >-
          {% for h in groups['mssql_ag'] %}
          N'{{ hostvars[h].ansible_facts.hostname }}' WITH (
            ENDPOINT_URL = N'tcp://{{ h }}:{{ endpoint_port_eff }}',
            AVAILABILITY_MODE = SYNCHRONOUS_COMMIT, FAILOVER_MODE = EXTERNAL, SEEDING_MODE = AUTOMATIC
          ){{ "," if not loop.last else "" }}
          {% endfor %}

    - name: Create the AG with DB_FAILOVER = ON, CLUSTER_TYPE = EXTERNAL
      shell: >
        {{ sqlcmd }} -Q
        "IF NOT EXISTS (SELECT 1 FROM sys.availability_groups WHERE name='{{ ag_name_eff }}')
         CREATE AVAILABILITY GROUP [{{ ag_name_eff }}] WITH (DB_FAILOVER = ON, CLUSTER_TYPE = EXTERNAL)
           FOR REPLICA ON {{ replica_clause }};"
      register: create_ag
      changed_when: false
      failed_when: create_ag.rc != 0 and 'already exists' not in (create_ag.stderr | default(''))

    - name: Grant create-any-database + Pacemaker permissions on the AG
      shell: >
        {{ sqlcmd }} -Q
        "ALTER AVAILABILITY GROUP [{{ ag_name_eff }}] GRANT CREATE ANY DATABASE;
         GRANT ALTER, CONTROL, VIEW DEFINITION ON AVAILABILITY GROUP::[{{ ag_name_eff }}] TO [pacemakerLogin];
         GRANT VIEW SERVER STATE TO [pacemakerLogin];"
      changed_when: false
      failed_when: false

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 5b — Create the AG Listener on the primary (registers the Pacemaker VIP in SQL Server)
#
# On Linux CLUSTER_TYPE=EXTERNAL the listener is split across two layers (MS docs:
# sql-server-linux-availability-group-overview.md):
#   - Pacemaker owns the floating IP (the `virtualip` IPaddr2 resource, created in Phase 9).
#   - SQL Server owns the listener OBJECT — `ALTER AVAILABILITY GROUP ... ADD LISTENER` with that
#     same IP. This is what makes SSMS show the listener and enables read-only routing.
# The listener IP MUST equal the Pacemaker VIP (listener_ip). Subnet mask is metadata only and is
# 0.0.0.0 on SQL 2022+ (255.255.255.255 on 2017/2019). Skipped when listener_ip is not set.
# ════════════════════════════════════════════════════════════════════════════════
- name: Create the AG Listener on the primary
  hosts: mssql_ag[0]
  become: true
  gather_facts: false
  vars:
    sa_password_eff: "{{ sa_password | default('') }}"
    ag_name_eff: "{{ ag_name | default('ag1') }}"
    listener_ip_eff: "{{ listener_ip | default('') }}"
    listener_name_eff: "{{ listener_name | default((ag_name | default('ag1')) ~ '-listener') }}"
    listener_port_eff: "{{ listener_port | default(1433) }}"
    listener_subnet_mask_eff: "{{ listener_subnet_mask | default('255.255.255.255' if (mssql_version | default('2025')) in ['2017','2019'] else '0.0.0.0') }}"
    # Use the named sysadmin login when db_admin_user is provided (created in Phase 1 by sa);
    # otherwise fall back to sa. Both must be set in the web UI for the named login to take effect.
    sqlcmd: '/opt/mssql-tools18/bin/sqlcmd -S localhost -U {{ (db_admin_user | default('''')) | ternary(db_admin_user | default(''''), ''sa'') }} -P "{{ (db_admin_user | default('''')) | ternary(db_admin_password | default(''''), sa_password | default('''')) }}" -C'
  tasks:
    - name: Note when no listener is requested
      debug:
        {
          msg: "listener_ip not set — skipping AG listener. Set listener_ip (= the Pacemaker VIP) to enable.",
        }
      when: listener_ip_eff | length == 0

    # Idempotent: skip if a listener already exists for this AG; 'already' in stderr is treated OK.
    - name: Add the AG listener (IP = Pacemaker VIP, mask 0.0.0.0 on SQL 2022/2025)
      when: listener_ip_eff | length > 0
      shell: >
        {{ sqlcmd }} -Q
        "IF NOT EXISTS (SELECT 1 FROM sys.availability_group_listeners agl
           JOIN sys.availability_groups ag ON agl.group_id = ag.group_id
           WHERE ag.name = N'{{ ag_name_eff }}')
         ALTER AVAILABILITY GROUP [{{ ag_name_eff }}]
           ADD LISTENER N'{{ listener_name_eff }}'
           (WITH IP ((N'{{ listener_ip_eff }}', N'{{ listener_subnet_mask_eff }}')), PORT = {{ listener_port_eff }});"
      register: listener_create
      changed_when: false
      failed_when: listener_create.rc != 0 and 'already' not in (listener_create.stderr | default('') | lower)

    - name: Show the registered listener
      when: listener_ip_eff | length > 0
      shell: >
        {{ sqlcmd }} -h -1 -Q
        "SELECT agl.dns_name, agl.port FROM sys.availability_group_listeners agl
         JOIN sys.availability_groups ag ON agl.group_id = ag.group_id
         WHERE ag.name = N'{{ ag_name_eff }}';"
      register: listener_show
      changed_when: false
      failed_when: false
    - debug:
        {
          msg: "AG listener for {{ ag_name_eff }}: {{ listener_show.stdout | default('(none reported)') | trim }}",
        }

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 6 — Join secondaries to the AG
# ════════════════════════════════════════════════════════════════════════════════
- name: Join secondaries to the AG
  hosts: mssql_ag[1:]
  become: true
  gather_facts: false
  vars:
    sa_password_eff: "{{ sa_password | default('') }}"
    ag_name_eff: "{{ ag_name | default('ag1') }}"
    # Use the named sysadmin login when db_admin_user is provided (created in Phase 1 by sa);
    # otherwise fall back to sa. Both must be set in the web UI for the named login to take effect.
    sqlcmd: '/opt/mssql-tools18/bin/sqlcmd -S localhost -U {{ (db_admin_user | default('''')) | ternary(db_admin_user | default(''''), ''sa'') }} -P "{{ (db_admin_user | default('''')) | ternary(db_admin_password | default(''''), sa_password | default('''')) }}" -C'
  tasks:
    - name: Join the AG (CLUSTER_TYPE = EXTERNAL) + grant permissions
      shell: >
        {{ sqlcmd }} -Q
        "ALTER AVAILABILITY GROUP [{{ ag_name_eff }}] JOIN WITH (CLUSTER_TYPE = EXTERNAL);
         ALTER AVAILABILITY GROUP [{{ ag_name_eff }}] GRANT CREATE ANY DATABASE;
         GRANT ALTER, CONTROL, VIEW DEFINITION ON AVAILABILITY GROUP::[{{ ag_name_eff }}] TO [pacemakerLogin];
         GRANT VIEW SERVER STATE TO [pacemakerLogin];"
      register: join_ag
      changed_when: false
      failed_when: join_ag.rc != 0 and 'already' not in (join_ag.stderr | default('') | lower)

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 7 — Install Pacemaker/Corosync + SQL Server HA resource agent (all nodes)
# ════════════════════════════════════════════════════════════════════════════════
- name: Install Pacemaker + Corosync + mssql-server-ha (all nodes)
  hosts: mssql_ag
  become: true
  gather_facts: false
  vars:
    hacluster_password_eff: "{{ hacluster_password | default((ag_name | default('ag1')) ~ '-HaCluster-Pa55!') }}"
  tasks:
    - name: Install Pacemaker/Corosync core packages
      apt:
        name: [pacemaker, pacemaker-cli-utils, pcs, fence-agents, corosync]
        state: present
        update_cache: yes

    # The OCF resource agents (incl. ocf:heartbeat:IPaddr2 for the AG virtual IP) ship in
    # `resource-agents-base` on Ubuntu 24.04 (the old `resource-agents` metapackage was split/renamed
    # in 23.10+). On 22.04 it's still `resource-agents`. Install whichever exists; crmsh is optional.
    - name: Install resource agents + optional helpers (package names vary by Ubuntu release)
      apt: { name: "{{ item }}", state: present }
      loop: [resource-agents-base, resource-agents, crmsh]
      failed_when: false

    - name: Verify the IPaddr2 OCF agent is present (needed for the AG virtual IP)
      stat: { path: /usr/lib/ocf/resource.d/heartbeat/IPaddr2 }
      register: ipaddr2_agent
    - name: Fail if no resource-agents package provided IPaddr2
      fail:
        msg: >-
          Neither resource-agents-base nor resource-agents installed the OCF agents
          (/usr/lib/ocf/resource.d/heartbeat/IPaddr2 missing). Check apt sources/universe is enabled
          on {{ inventory_hostname }} ({{ ansible_facts['distribution'] | default('?') }}
          {{ ansible_facts['distribution_version'] | default('?') }}).
      when: not ipaddr2_agent.stat.exists

    - name: Install the SQL Server HA resource agent
      apt: { name: mssql-server-ha, state: present }
      failed_when: false

    # Set it on the TARGET via chpasswd (hashes locally) instead of the controller's password_hash
    # filter — the latter needs `passlib` on the jump host (Python 3.13+ dropped the stdlib `crypt`
    # module, so password_hash fails without passlib). chpasswd avoids that dependency entirely.
    - name: Set the hacluster user password (same on all nodes)
      shell: "echo 'hacluster:{{ hacluster_password_eff }}' | chpasswd"
      no_log: true
      changed_when: true

    # Clear any leftover cluster state LOCALLY on each node (stale corosync.conf + running
    # corosync/pacemaker from a prior/hand-rolled attempt). Doing it locally avoids `pcs cluster
    # setup --force` having to remotely destroy each node via pcsd — that remote destroy times out
    # (60s) when the old services are in a bad state. Idempotent: no-op on a clean node.
    - name: Tear down any pre-existing cluster state (local, idempotent)
      shell: pcs cluster destroy
      failed_when: false
      changed_when: true

    - name: Ensure pcsd is running on every node (pcs cluster setup connects to it)
      systemd: { name: pcsd, state: started, enabled: true }

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 8 — Build the Pacemaker/Corosync cluster the supported Ubuntu way (pcs 0.11):
#   pcs host auth  ->  pcs cluster setup  ->  pcs cluster start/enable --all.
# Hand-writing corosync.conf + restarting services (RHEL-style) leaves all nodes OFFLINE on
# Ubuntu because pcsd/pacemaker are never initialized through pcs. The primary drives all nodes
# via pcsd (port 2224); node names resolve via the /etc/hosts entries written in Phase 1.
# ════════════════════════════════════════════════════════════════════════════════
- name: Build the Pacemaker cluster with pcs (primary drives all nodes)
  hosts: mssql_ag[0]
  become: true
  gather_facts: false
  vars:
    cluster_name_eff: "{{ cluster_name | default((ag_name | default('ag1')) ~ 'cluster') }}"
    hacluster_password_eff: "{{ hacluster_password | default((ag_name | default('ag1')) ~ '-HaCluster-Pa55!') }}"
    enable_fencing_eff: "{{ enable_fencing | default(false) }}"
    ag_node_names: "{{ groups['mssql_ag'] | map('extract', hostvars) | map(attribute='ansible_facts.hostname') | join(' ') }}"
    # "name addr=IP" pairs so `pcs cluster setup` pins each corosync ring0_addr to the node's real
    # LAN IP — corosync then binds the right interface regardless of how /etc/hosts resolves names.
    ag_node_setup: >-
      {% for h in groups['mssql_ag'] %}{{ hostvars[h].ansible_facts.hostname }} addr={{ h }}{% if not loop.last %} {% endif %}{% endfor %}
  tasks:
    - name: Authenticate all nodes to pcsd as hacluster
      shell: "pcs host auth {{ ag_node_names }} -u hacluster -p '{{ hacluster_password_eff }}'"
      no_log: true
      register: pcs_auth
      retries: 6
      delay: 10
      until: pcs_auth.rc == 0
      changed_when: true

    # Nodes were destroyed locally above, so --force has nothing to remote-destroy.
    # NOTE: `pcs cluster setup` does not accept --request-timeout (only commands that
    # talk to remote pcsd, like `pcs host auth`, do). Retry to ride out slow first contact.
    - name: Create the cluster (fresh; nodes already cleaned locally)
      shell: "pcs cluster setup {{ cluster_name_eff }} {{ ag_node_setup }} --force"
      register: pcs_setup
      retries: 3
      delay: 10
      until: pcs_setup.rc == 0
      changed_when: true

    - name: Start + enable the cluster on all nodes
      shell: |
        pcs cluster start --all
        pcs cluster enable --all
      changed_when: true

    # The freshly-started cluster must converge into ONE quorate partition with EVERY node
    # Online before we touch resources. The previous check only required "a DC exists", which a
    # lone, no-quorum node also satisfies — so a split-brain (each node alone, the others
    # UNCLEAN) slipped through and every later step ran against a 1-node partition. Gate strictly
    # on membership + quorum here; the fail task below makes a non-converging cluster loud.
    - name: Wait until the cluster is quorate with all nodes Online
      shell: |
        status="$(pcs status 2>/dev/null)" || exit 1
        echo "$status" | grep -q 'partition WITHOUT quorum' && exit 1
        online="$(echo "$status" | sed -n 's/.*Online:[[:space:]]*\[[[:space:]]*\(.*\)[[:space:]]*\].*/\1/p')"
        for n in {{ ag_node_names }}; do
          echo " $online " | grep -q " $n " || exit 1
        done
        exit 0
      register: cluster_quorate
      retries: 24
      delay: 10
      until: cluster_quorate.rc == 0
      changed_when: false
      failed_when: false

    - name: Gather corosync/pacemaker diagnostics if the cluster never converged
      when: cluster_quorate.rc != 0
      shell: |
        echo "== pcs status =="; pcs status 2>&1 || true
        echo "== corosync quorum =="; corosync-quorumtool -s 2>&1 || true
        echo "== corosync rings =="; corosync-cfgtool -s 2>&1 || true
        echo "== corosync journal (last 40) =="; journalctl -u corosync --no-pager -n 40 2>&1 || true
      register: cluster_diag
      changed_when: false

    - name: Fail if the cluster did not form a quorate, all-nodes-Online partition
      when: cluster_quorate.rc != 0
      fail:
        msg: |
          Pacemaker cluster '{{ cluster_name_eff }}' did not converge to a single quorate partition
          with all nodes Online ({{ ag_node_names }}). This is almost always corosync inter-node
          traffic (UDP 5405 between {{ groups['mssql_ag'] | join(', ') }}) being blocked, or node
          names not resolving. Verify 5405/udp is open between every node and that /etc/hosts maps
          each node name to its IP on every node. Diagnostics from {{ inventory_hostname }}:
          {{ cluster_diag.stdout }}

    # Disable node-level fencing (STONITH) for the lab AS SOON AS the cluster is quorate, so a
    # transient membership blip can't leave nodes UNCLEAN-and-unfenceable (which blocks recovery).
    # Setting it while the partition is quorate guarantees it replicates to every node's CIB.
    # Production MUST configure a real fencing device instead (set enable_fencing=true).
    - name: Disable STONITH while the cluster is quorate (lab only)
      shell: pcs property set stonith-enabled=false
      when: not (enable_fencing_eff | bool)
      changed_when: false

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 9 — Cluster properties + AG resource + virtual IP (primary)
# ════════════════════════════════════════════════════════════════════════════════
- name: Configure Pacemaker resources for the AG (primary)
  hosts: mssql_ag[0]
  become: true
  gather_facts: false
  vars:
    ag_name_eff: "{{ ag_name | default('ag1') }}"
    listener_ip_eff: "{{ listener_ip | default('') }}"
    enable_fencing_eff: "{{ enable_fencing | default(false) }}"
  tasks:
    - name: Wait for the cluster to report nodes
      shell: pcs status >/dev/null 2>&1
      register: pcs_ready
      retries: 12
      delay: 5
      until: pcs_ready.rc == 0
      changed_when: false
      failed_when: false

    - name: Disable STONITH for lab (production MUST configure a real fencing device)
      shell: pcs property set stonith-enabled=false
      when: not (enable_fencing_eff | bool)
      changed_when: false
      failed_when: false

    - name: Set cluster-recheck-interval + start-failure-is-fatal
      shell: |
        pcs property set cluster-recheck-interval=2min
        pcs property set start-failure-is-fatal=true
      changed_when: false
      failed_when: false

    # `pcs resource show <name>` was removed in pcs 0.11 (Ubuntu 24.04) — use `pcs resource config`,
    # which exists on both pcs 0.10 (22.04) and 0.11. It's the idempotency guard before create.
    #
    # IMPORTANT: the `pcs resource create` must stay on ONE physical line. In a YAML folded scalar
    # (`>`/`>-`), a line indented MORE than the first becomes a literal newline (not a space). The
    # old form put `meta ... promotable notify=true` on an extra-indented line, so it ran as a
    # SEPARATE command — leaving ag_cluster a bare primitive (no clone, no notify=true). Pacemaker
    # then reported "Resource must be configured with notify=true" and BLOCKED the resource.
    - name: Create the AG cluster resource (ocf:mssql:ag, promotable)
      shell: >-
        pcs resource config ag_cluster >/dev/null 2>&1 ||
        pcs resource create ag_cluster ocf:mssql:ag ag_name={{ ag_name_eff }} meta failure-timeout=60s promotable notify=true
      changed_when: false
      failed_when: false

    - name: Create the virtual IP resource (when listener_ip is provided)
      when: listener_ip_eff | length > 0
      shell: >-
        pcs resource config virtualip >/dev/null 2>&1 ||
        pcs resource create virtualip ocf:heartbeat:IPaddr2 ip={{ listener_ip_eff }}
      changed_when: false
      failed_when: false

    # The VIP MUST be colocated with the PROMOTED role of the promotable clone (ag_cluster-clone),
    # NOT the bare primitive (ag_cluster). pcs will happily accept `with promoted ag_cluster`, but
    # that constraint does NOT track failover — so the listener VIP just sits on whichever node it
    # first started on and ends up answering on a SECONDARY (the bug we hit: node3 primary, VIP on
    # node1). Fix: (1) delete any stale virtualip constraints from older runs, then (2) recreate
    # against ag_cluster-clone. The promote keyword differs by pcs version — `promoted` (pcs 0.11 /
    # Ubuntu 24.04) vs `master` (pcs 0.10 / 22.04) — so try the modern form, fall back to legacy.
    # NO `|| true` masking the add: a real failure must surface (set -e + the assert task below).
    - name: Colocate the VIP with the promoted AG replica + order promote-then-VIP
      when: listener_ip_eff | length > 0
      shell: |
        set -e
        for id in $(pcs constraint --full | grep -i virtualip | grep -oE 'id: ?[^) ]+' | sed 's/id: *//' || true); do
          pcs constraint delete "$id" 2>/dev/null || true
        done
        pcs constraint colocation add virtualip with promoted ag_cluster-clone INFINITY \
          || pcs constraint colocation add virtualip with master ag_cluster-clone INFINITY
        pcs constraint order promote ag_cluster-clone then start virtualip kind=Mandatory \
          || pcs constraint order promote ag_cluster then start virtualip kind=Mandatory
      changed_when: false

    # Safety net: the create task above runs with failed_when:false (idempotent rerun), so a
    # silent miscreation would otherwise pass unnoticed. Creating ag_cluster with `promotable`
    # makes pcs auto-name the clone `ag_cluster-clone`; if that clone is absent the AG resource
    # is a bare primitive (no notify=true) and Pacemaker will BLOCK it. Fail loudly here instead.
    - name: Assert the promotable clone ag_cluster-clone exists
      shell: pcs resource config ag_cluster-clone >/dev/null 2>&1
      register: clone_check
      changed_when: false
      failed_when: clone_check.rc != 0

    # Belt-and-suspenders: the colocation is what makes the listener follow the primary. If it
    # didn't take (wrong keyword, clone not yet present, etc.), fail here instead of shipping a
    # cluster whose listener silently answers on a secondary.
    - name: Assert the VIP is colocated with the promoted AG replica (else listener lands on a secondary)
      when: listener_ip_eff | length > 0
      # Format-agnostic: pcs 0.10 (22.04) prints `virtualip with ag_cluster-clone`, pcs 0.11
      # (24.04) prints `resource 'virtualip' with resource 'ag_cluster-clone'`. Match either by
      # requiring a colocation line that names BOTH resources, regardless of quoting/spacing.
      shell: pcs constraint colocation --full | grep -i virtualip | grep -q ag_cluster-clone
      register: vip_colo_check
      changed_when: false
      failed_when: vip_colo_check.rc != 0

# ════════════════════════════════════════════════════════════════════════════════
# PHASE 10 — Status + checklist
# ════════════════════════════════════════════════════════════════════════════════
- name: Report AG + cluster status
  hosts: mssql_ag[0]
  become: true
  gather_facts: false
  vars:
    sa_password_eff: "{{ sa_password | default('') }}"
    ag_name_eff: "{{ ag_name | default('ag1') }}"
    listener_ip_eff: "{{ listener_ip | default('') }}"
    # Use the named sysadmin login when db_admin_user is provided (created in Phase 1 by sa);
    # otherwise fall back to sa. Both must be set in the web UI for the named login to take effect.
    sqlcmd: '/opt/mssql-tools18/bin/sqlcmd -S localhost -U {{ (db_admin_user | default('''')) | ternary(db_admin_user | default(''''), ''sa'') }} -P "{{ (db_admin_user | default('''')) | ternary(db_admin_password | default(''''), sa_password | default('''')) }}" -C'
  tasks:
    - name: AG replica health
      shell: >
        {{ sqlcmd }} -Q
        "SELECT ar.replica_server_name, rs.role_desc, rs.synchronization_health_desc
         FROM sys.availability_replicas ar
         JOIN sys.dm_hadr_availability_replica_states rs ON ar.replica_id=rs.replica_id;"
      register: ag_status
      changed_when: false
      failed_when: false
    - name: pcs status
      shell: pcs status
      register: pcs_out
      changed_when: false
      failed_when: false
    - name: Report
      debug:
        msg:
          - "── AG replicas ──"
          - "{{ ag_status.stdout_lines | default(['(n/a)']) }}"
          - "── Pacemaker ──"
          - "{{ pcs_out.stdout_lines | default(['(n/a)']) }}"
          - "HA AG '{{ ag_name_eff }}' (CLUSTER_TYPE=EXTERNAL, 3 synchronous, automatic failover)."
          - "Connect WSO2 to the virtual IP {{ listener_ip_eff | default('(set listener_ip to enable)') }} (port 1433)."
          - "PRODUCTION: configure a real STONITH/fencing device (set enable_fencing=true after configuring it)."
          - "Add user DBs (FULL recovery + one full backup on primary) — automatic seeding replicates them."
