- name: Deploy ELK stack from vendored docker/elk directory
  hosts: docker_vm
  become: true
  vars:
    repo_root: "/home/{{ ansible_user }}/autoprovision"
    elk_dir: "{{ repo_root }}/docker/elk"
    kibana_domain: "{{ kibana_domain | default('kibana.local') }}"
  tasks:
    - name: Show ELK directory
      debug:
        msg: "Using elk_dir={{ elk_dir }}"

    - name: Ensure ELK directory exists (already copied from repo)
      file:
        path: "{{ elk_dir }}"
        state: directory
        mode: '0755'

    - name: Run ELK setup (docker compose up setup)
      shell: docker compose up setup
      args:
        chdir: "{{ elk_dir }}"

    - name: Start ELK + Fleet + APM Server
      shell: >
        docker compose -f docker-compose.yml -f extensions/fleet/fleet-compose.yml -f extensions/fleet/agent-apmserver-compose.yml up -d
      args:
        chdir: "{{ elk_dir }}"

    - name: Report ELK deployment complete
      debug:
        msg: "ELK stack (Elasticsearch, Logstash, Kibana, Fleet, APM Server) deployed from {{ elk_dir }}."
