# Create / update a Kubernetes TLS secret in a specific RKE2 cluster.
#
# Runs on the JUMP HOST (localhost) using the cluster kubeconfig that
# ansible/rke2_cluster.yml fetched to data/k8s/<cluster>/kubeconfig. Used to install
# the TLS cert that Istio / WSO2 serve (e.g. secret `wso2-ingress-cert` in istio-system).
# Idempotent: re-running replaces the secret with the new cert (apply).
#
# Required variables (passed by the web UI):
#   kubeconfig_path  path to the target cluster's kubeconfig on the jump host
#   namespace        target namespace(s) — ONE or a comma/space/newline-separated list
#                    (e.g. "istio-system,argocd,wso2-cp,wso2-internal-gw,wso2-external-gw,wso2-is").
#                    The same secret is created in EACH. NOTE: Istio gateways resolve credentialName
#                    from istio-system only; extra namespaces are for apps that mount the cert directly.
#   secret_name      TLS secret name (e.g. wso2-ingress-cert)
#   cert_src         path on the jump host to the certificate PEM
#   key_src          path on the jump host to the private key PEM

- name: Create/update a Kubernetes TLS secret
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "kubectl --kubeconfig {{ kubeconfig_path }}"
    # Accept one namespace or a comma/space/newline-separated list → clean Python list.
    namespaces_list: "{{ (namespace | default('istio-system')).replace(',', ' ').split() }}"
  tasks:
    - name: Verify the cluster kubeconfig exists
      stat:
        path: "{{ kubeconfig_path }}"
      register: kc

    - name: Fail clearly if the kubeconfig is missing
      fail:
        msg: >-
          kubeconfig not found at {{ kubeconfig_path }}. Install the RKE2 cluster first
          (the RKE2 workload fetches it to data/k8s/<cluster>/kubeconfig).
      when: not kc.stat.exists

    - name: Verify the cluster is reachable
      shell: "{{ kubectl }} version --request-timeout=15s >/dev/null 2>&1"
      register: reachable
      changed_when: false
      failed_when: reachable.rc != 0

    - name: Ensure each target namespace exists
      shell: >
        {{ kubectl }} create namespace {{ ns }} --dry-run=client -o yaml | {{ kubectl }} apply -f -
      loop: "{{ namespaces_list }}"
      loop_control: { loop_var: ns }
      register: ns_apply
      changed_when: "'created' in ns_apply.stdout"

    # ── Path A: a PEM was provided → create/replace the secret in EACH namespace ──
    # One physical line: a folded scalar (`>`/`>-`) turns more-indented continuation lines into
    # literal newlines, which would split `--cert/--key` off and break `create secret tls`.
    - name: Create or update the TLS secret from the provided PEM (per namespace)
      shell: >-
        {{ kubectl }} -n {{ ns }} create secret tls {{ secret_name }} --cert={{ cert_src }} --key={{ key_src }} --dry-run=client -o yaml | {{ kubectl }} apply -f -
      loop: "{{ namespaces_list }}"
      loop_control: { loop_var: ns }
      register: secret_apply
      changed_when: "'configured' in secret_apply.stdout or 'created' in secret_apply.stdout"
      when: not (use_certmanager | default(false) | bool)

    # ── Path B: no PEM → cert-manager issues + AUTO-RENEWS the secret from the internal CA ──
    # Requires the 'cert-manager (internal CA)' workload to have run on this cluster first.
    - name: Check the ca-issuer ClusterIssuer is Ready (cert-manager fallback)
      shell: "{{ kubectl }} get clusterissuer {{ ca_issuer | default('ca-issuer') }} -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}'"
      register: ca_issuer_ready
      changed_when: false
      failed_when: false
      when: use_certmanager | default(false) | bool

    - name: Fail clearly if cert-manager / ca-issuer is not ready
      fail:
        msg: >-
          No PEM was supplied, so this falls back to cert-manager — but ClusterIssuer
          '{{ ca_issuer | default('ca-issuer') }}' is not Ready (got '{{ ca_issuer_ready.stdout | default('') }}').
          Run the 'cert-manager (internal CA)' workload for this cluster first, then re-run this.
      when:
        - use_certmanager | default(false) | bool
        - ca_issuer_ready.stdout | default('') != 'True'

    - name: Issue the TLS secret via cert-manager in each namespace (auto-renewing Certificate)
      shell: |
        cat <<EOF | {{ kubectl }} apply -f -
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata: { name: {{ secret_name }}, namespace: {{ ns }} }
        spec:
          secretName: {{ secret_name }}
          duration: 8760h
          renewBefore: 720h
          commonName: "{{ (cert_dns | default('*.example.com')).split(',')[0] | trim }}"
          dnsNames: [{% for d in (cert_dns | default('*.example.com')).split(',') %}"{{ d | trim }}"{{ "," if not loop.last else "" }}{% endfor %}]
          issuerRef: { name: {{ ca_issuer | default('ca-issuer') }}, kind: ClusterIssuer, group: cert-manager.io }
        EOF
      loop: "{{ namespaces_list }}"
      loop_control: { loop_var: ns }
      changed_when: true
      when: use_certmanager | default(false) | bool

    - name: Wait until cert-manager has written the secret in each namespace
      shell: "{{ kubectl }} -n {{ ns }} get secret {{ secret_name }} -o name"
      loop: "{{ namespaces_list }}"
      loop_control: { loop_var: ns }
      register: cm_secret
      retries: 18
      delay: 10
      until: cm_secret.rc == 0
      changed_when: false
      when: use_certmanager | default(false) | bool

    - name: Report
      debug:
        msg: >-
          TLS secret '{{ secret_name }}' is set in namespaces {{ namespaces_list }}
          ({{ 'cert-manager / internal CA, auto-renewing, dnsNames=' ~ (cert_dns | default('*.example.com'))
              if (use_certmanager | default(false) | bool) else 'from provided PEM' }}).
          Istio gateways resolve credentialName from istio-system; the other namespaces are for apps
          that mount the cert directly. Gateways reload via SDS automatically — no restart needed.
