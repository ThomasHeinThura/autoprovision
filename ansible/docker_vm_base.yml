- name: Bootstrap Docker VM — base packages and Docker
  hosts: docker_vm
  become: true
  vars:
    repo_url: "https://github.com/ThomasHeinThura/autoprovision.git"
    repo_dest: "/home/{{ ansible_user }}/autoprovision"
  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_facts["os_family"] == "Debian"

    - name: Install base packages
      package:
        name:
          - git
          - curl
          - wget
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    - name: Install Docker using official convenience script (idempotent via creates)
      shell: |
        curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
        sh /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Ensure docker service is enabled and started
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ansible_user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Ensure repo parent directory exists (automation user home)
      file:
        path: "{{ repo_dest | dirname }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Clone autoprovision repo on Docker VM (into automation user home)
      become_user: "{{ ansible_user }}"
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: main
        force: no
