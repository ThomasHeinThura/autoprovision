- name: Deploy ELK stack from vendored docker/elk directory
  hosts: docker_vm
  become: true
  vars:
    repo_url: "https://github.com/ThomasHeinThura/autoprovision.git"
    repo_root: "/home/{{ ansible_user }}/autoprovision"
    elk_dir: "{{ repo_root }}/docker/elk"
    kibana_domain: "{{ kibana_domain | default('kibana.local') }}"
  tasks:
    - name: Check whether repo root is a git checkout
      stat:
        path: "{{ repo_root }}/.git"
      register: repo_git_stat

    - name: Check whether repo root path exists
      stat:
        path: "{{ repo_root }}"
      register: repo_root_stat

    - name: Remove invalid repo root if it exists but is not a git checkout
      file:
        path: "{{ repo_root }}"
        state: absent
      when: repo_root_stat.stat.exists and not repo_git_stat.stat.exists

    - name: Ensure autoprovision repo is present and up to date
      become_user: "{{ ansible_user }}"
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_root }}"
        version: main
        update: yes
        force: yes

    - name: Show ELK directory
      debug:
        msg: "Using elk_dir={{ elk_dir }}"

    - name: Ensure ELK directory exists (already copied from repo)
      file:
        path: "{{ elk_dir }}"
        state: directory
        mode: "0755"

    - name: Run ELK setup (docker compose up setup)
      shell: |
        export KIBANA_DOMAIN='{{ kibana_domain }}'
        docker compose up setup
      args:
        chdir: "{{ elk_dir }}"

    - name: Start ELK + Fleet + APM Server
      shell: |
        export KIBANA_DOMAIN='{{ kibana_domain }}'
        docker compose -f docker-compose.yml -f extensions/fleet/fleet-compose.yml -f extensions/fleet/agent-apmserver-compose.yml up -d
      args:
        chdir: "{{ elk_dir }}"

    - name: Report ELK deployment complete
      debug:
        msg: "ELK stack (Elasticsearch, Logstash, Kibana, Fleet, APM Server) deployed from {{ elk_dir }}."
