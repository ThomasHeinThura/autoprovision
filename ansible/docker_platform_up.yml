- name: Bring up Docker platform stack (Postgres + Traefik + Dockhand)
  hosts: docker_vm
  become: true
  vars:
    repo_root: "/home/{{ ansible_user }}/autoprovision"
    compose_dir: "{{ repo_root }}/docker"
    traefik_dir: "{{ compose_dir }}/traefik"
    traefik_certs_dir: "{{ traefik_dir }}/certs"
    dockhand_domain_safe: "{{ dockhand_domain | default('dockhand.local') }}"
  tasks:
    - name: Show compose directory
      debug:
        msg: "Using compose_dir={{ compose_dir }}"

    - name: Ensure compose directory exists
      file:
        path: "{{ compose_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure Traefik directory exists
      file:
        path: "{{ traefik_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure Traefik certs directory exists
      file:
        path: "{{ traefik_certs_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure Traefik acme file exists with strict permissions
      file:
        path: "{{ traefik_dir }}/acme.json"
        state: touch
        mode: "0600"

    - name: Pull latest platform images (Postgres, Traefik, Dockhand)
      shell: |
        export DOCKHAND_DOMAIN='{{ dockhand_domain_safe }}'
        docker compose -f docker-compose.platform.yml pull
      args:
        chdir: "{{ compose_dir }}"

    - name: Bring up platform stack (Postgres + Traefik + Dockhand)
      shell: |
        export DOCKHAND_DOMAIN='{{ dockhand_domain_safe }}'
        docker compose -f docker-compose.platform.yml up -d --force-recreate --remove-orphans
      args:
        chdir: "{{ compose_dir }}"

    - name: Wait for Postgres to be healthy
      shell: >
        docker inspect --format='{{"{{"}}.State.Health.Status{{"}}"}}' pg-platform
      register: pg_health
      until: pg_health.stdout == "healthy"
      retries: 20
      delay: 5
      changed_when: false

    - name: Report Postgres health status
      debug:
        msg: "Postgres health: {{ pg_health.stdout }}"
