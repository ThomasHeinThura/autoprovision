# Echo test app for validating the shared-gateway path independent of WSO2.
#
# Deploys a plain HTTP echo server + Service, then an HTTPRoute that attaches to the cluster-wide
# `shared-gateway` (istio-system) for host echo.example.com. No DestinationRule / TLS origination is
# needed: the echo backend speaks plain HTTP on port 80, so the Gateway Envoy talks to it directly
# (ztunnel still wraps the hop in mTLS if this namespace is enrolled in the ambient mesh).
#
#   kubectl apply -f echo.yaml
#   curl -vk --resolve echo.example.com:443:<GATEWAY_IP> https://echo.example.com/
#
# A 200 here proves shared-gateway + TLS + routing work, isolating any WSO2 503 to the WSO2 backend.
apiVersion: v1
kind: Namespace
metadata:
  name: echo-test
  labels:
    # Enroll in the ambient mesh to match how wso2-cp is wired. Drop this label to test the
    # gateway path without ztunnel in the loop.
    istio.io/dataplane-mode: ambient
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: echo-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          # Returns request headers/method/path as JSON; listens on :8080 by default.
          image: ealen/echo-server:0.9.2
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: echo-test
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-route
  namespace: echo-test
spec:
  parentRefs:
    - name: shared-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - "echo.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: echo
          port: 80
