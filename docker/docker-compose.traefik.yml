# ─────────────────────────────────────────────────────────────────────────────
# Traefik edge proxy — installed on EVERY Docker VM (GitLab, Prod ELK, UAT ELK)
# right after Docker base, BEFORE any service stack.
#
# The shared `platform` Docker network is created once by the playbook
# (ansible/traefik_stack.yml) and is EXTERNAL to every stack — no compose project
# owns it. Service stacks on the same VM (platform/dockhand+postgres, gitlab,
# elk/kibana) attach to `platform` and publish themselves via Traefik labels.
#
# All Docker stacks run under the same default compose project, and none use
# `--remove-orphans`, so re-running one stack never disturbs the others.
#
# Traefik v3.7.1 (version.md). HTTPS on :443, HTTP:80 redirects to HTTPS.
# ─────────────────────────────────────────────────────────────────────────────

services:

  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
    networks:
      - platform

networks:
  # External — created once by ansible/traefik_stack.yml; no stack owns it.
  platform:
    external: true
    name: platform
