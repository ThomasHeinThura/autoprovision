# ─────────────────────────────────────────────────────────────────────────────
# Platform base services for the GitLab VM: PostgreSQL + Dockhand ONLY.
#
# Traefik is no longer part of this stack — it is installed first as its own
# stack (docker-compose.traefik.yml) on every Docker VM, and OWNS the `platform`
# network this stack attaches to. Bring Traefik up before this stack.
#
# Versions from version.md (May 2026): PostgreSQL 17.10, Dockhand v0.29.4.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Shared PostgreSQL (GitLab, SonarQube, platform state) ─────────────────
  postgres:
    image: postgres:17.10
    container_name: pg-platform
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: platform
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform

  # ── Dockhand (Docker management and monitoring UI) ───────────────────────
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - platform
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=platform"
      - "traefik.http.routers.dockhand.rule=Host(`${DOCKHAND_DOMAIN:-dockhand.local}`)"
      - "traefik.http.routers.dockhand.entrypoints=websecure"
      - "traefik.http.routers.dockhand.tls=true"
      - "traefik.http.routers.dockhand.tls.certresolver=le"
      - "traefik.http.routers.dockhand.middlewares=security-headers@file"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"

volumes:
  pg_data:

networks:
  # External — created by ansible/traefik_stack.yml (run before this stack).
  platform:
    external: true
    name: platform
