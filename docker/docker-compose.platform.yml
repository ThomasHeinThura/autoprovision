version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Core platform network + base services
# Versions from version.md (May 2026)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Shared PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:17.10
    container_name: pg-platform
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: platform
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform

  # ── Traefik (HTTPS ingress on :443) ───────────────────────────────────────
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
    networks:
      - platform

  # ── Dockhand (Docker management and monitoring UI) ───────────────────────
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - "8080:${DOCKHAND_INTERNAL_PORT:-80}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - platform
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=platform"
      - "traefik.http.routers.dockhand.rule=Host(`${DOCKHAND_DOMAIN:-dockhand.local}`)"
      - "traefik.http.routers.dockhand.entrypoints=websecure"
      - "traefik.http.routers.dockhand.tls=true"
      - "traefik.http.routers.dockhand.tls.certresolver=le"
      - "traefik.http.routers.dockhand.middlewares=security-headers@file"
      - "traefik.http.services.dockhand.loadbalancer.server.port=${DOCKHAND_INTERNAL_PORT:-80}"

volumes:
  pg_data:

networks:
  platform:
    name: platform
    driver: bridge
