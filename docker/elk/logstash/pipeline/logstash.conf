input {
	beats {
		port => 5044
	}

	tcp {
		port => 50000
	}
}

## WSO2 APIM metrics: the gateway filebeat sidecars ship apim_metrics.log lines that contain
## "apimMetrics:". Parse only those; everything else passes through untouched.
filter {
	if "apimMetrics" in [message] {
		grok {
			match => ["message", "%{GREEDYDATA:UNWANTED}\ apimMetrics:%{GREEDYDATA:apimMetrics}\, %{GREEDYDATA:UNWANTED} \:%{GREEDYDATA:properties}"]
		}
		json {
			source => "properties"
		}
	}
}

output {
	## Route WSO2 APIM events to their own indices; logstash_internal is granted apim_event_* by
	## setup/roles/logstash_writer.json. Everything else goes to the default Logstash index.
	if [apimMetrics] == " apim:response" {
		elasticsearch {
			hosts => "elasticsearch:9200"
			user => "logstash_internal"
			password => "${LOGSTASH_INTERNAL_PASSWORD}"
			index => "apim_event_response"
		}
	} else if [apimMetrics] == " apim:faulty" {
		elasticsearch {
			hosts => "elasticsearch:9200"
			user => "logstash_internal"
			password => "${LOGSTASH_INTERNAL_PASSWORD}"
			index => "apim_event_faulty"
		}
	} else {
		elasticsearch {
			hosts => "elasticsearch:9200"
			user => "logstash_internal"
			password => "${LOGSTASH_INTERNAL_PASSWORD}"
		}
	}
}
