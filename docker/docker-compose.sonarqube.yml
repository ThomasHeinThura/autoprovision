version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# SonarQube with community branch plugin
# Version: 26.4.0.121862
# Requires: platform network and Postgres running
# ─────────────────────────────────────────────────────────────────────────────

services:

  sonarqube:
    image: mc1arke/sonarqube-with-community-branch-plugin:26.4.0.121862-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-platform}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - platform
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`${SONARQUBE_DOMAIN:-sonarqube.local}`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  platform:
    external: true
    name: platform
