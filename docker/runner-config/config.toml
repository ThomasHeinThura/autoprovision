concurrent = 1
check_interval = 0
connection_max_age = "15m0s"
shutdown_timeout = 0

[session_server]
  session_timeout = 1800

[[runners]]
  name = "local-docker-runner"
  url = "https://gitlab.example.com"
  token = "PASTE_NEW_RUNNER_TOKEN_HERE"
  executor = "docker"
  request_concurrency = 2

  [runners.cache]
    MaxUploadedArchiveSize = 0
    [runners.cache.s3]
      AssumeRoleMaxConcurrency = 0
    [runners.cache.gcs]
    [runners.cache.azure]

  [runners.docker]
    tls_verify = false
    image = "alpine:latest"
    privileged = true
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = [
      "/var/run/docker.sock:/var/run/docker.sock",
      "/cache",
      "/etc/gitlab-runner/certs/gitlab.example.com.crt:/usr/local/share/ca-certificates/local-dev-ca.crt:ro"
    ]
    volume_keep = false
    extra_hosts = [
      "gitlab.example.com:host-gateway",
      "registry.example.com:host-gateway"
    ]
    pull_policy = ["if-not-present"]
    shm_size = 0
    network_mtu = 0
