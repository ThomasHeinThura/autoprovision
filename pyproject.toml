[project]
name = "autoprovision"
version = "1.0.0"
description = "On-premise infrastructure provisioning control plane"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI dependency injection uses calls in defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
