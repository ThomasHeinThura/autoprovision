apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: apim-vs
  namespace: wso2-cp
spec:
  hosts:
    - "apim.example.com"
  gateways:
    - istio-system/wso2-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: apim-wso2am-acp-service
            port:
              number: 9443
---
# DestinationRule for APIM - Enable TLS to backend with self-signed cert support
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: apim-dr
  namespace: wso2-cp
spec:
  host: apim-wso2am-acp-service
  trafficPolicy:
    # Sticky sessions: apim-wso2am-acp-service fronts BOTH control-plane pods (acp-1 + acp-2),
    # so without affinity the Publisher/DevPortal/Admin console round-robins between them and
    # logins/CSRF break. consistentHash pins each client to one pod via an Istio-issued cookie.
    loadBalancer:
      consistentHash:
        httpCookie:
          name: SERVERID
          ttl: 0s   # session cookie (cleared when the browser closes)
    tls:
      mode: SIMPLE
      insecureSkipVerify: true # Required for self-signed certificates
    portLevelSettings:
      - port:
          number: 9443
        tls:
          mode: SIMPLE
          insecureSkipVerify: true

