apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: apim-vs
  namespace: wso2-cp
spec:
  hosts:
    - "apim.example.com"
  gateways:
    - istio-system/wso2-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: apim-wso2am-acp-service
            # Mesh-native: route to the PLAINTEXT servlet port (9763). The ingress terminates the
            # client TLS (wso2-ingress-cert) and the ingress->pod hop is secured by Istio mTLS.
            # No backend TLS origination, so in-mesh WSO2->WSO2 calls are no longer double-TLS'd.
            port:
              number: 9763
---
# DestinationRule for APIM — sticky sessions ONLY (no TLS origination under mesh-native).
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: apim-dr
  namespace: wso2-cp
spec:
  host: apim-wso2am-acp-service
  trafficPolicy:
    # apim-wso2am-acp-service fronts BOTH control-plane pods (acp-1 + acp-2); without affinity the
    # carbon console / Publisher / DevPortal round-robins and logins/CSRF break. consistentHash
    # pins each client to one pod via an Istio-issued cookie. No portLevelSettings now, so this
    # applies to the 9763 route.
    loadBalancer:
      consistentHash:
        httpCookie:
          name: SERVERID
          ttl: 0s   # session cookie (cleared when the browser closes)

