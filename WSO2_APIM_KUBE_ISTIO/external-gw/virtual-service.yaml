apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: gw-vs
  namespace: wso2-external-gw
spec:
  hosts:
    - "external-gw.example.com"
  gateways:
    - istio-system/wso2-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: apim-gw-wso2am-universal-gw-service
            # Mesh-native: route to the PLAINTEXT pass-through port (8280). Ingress terminates the
            # client TLS; ingress->pod is secured by Istio mTLS. No backend TLS origination.
            port:
              number: 8280
# No DestinationRule: API traffic is stateless (token-based) so no session affinity is needed,
# and TLS origination is gone under mesh-native. Istio mTLS secures the ingress->gateway hop.

