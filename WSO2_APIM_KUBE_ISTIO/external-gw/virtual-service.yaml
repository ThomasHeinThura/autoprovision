apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: gw-vs
  namespace: wso2-external-gw
spec:
  hosts:
    - "external-gw.example.com"
  gateways:
    - istio-system/wso2-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: apim-gw-wso2am-universal-gw-service
            port:
              number: 8243
---
---
# DestinationRule for Gateway - Enable TLS to backend with self-signed cert support
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: gw-dr
  namespace: wso2-external-gw
spec:
  host: apim-gw-wso2am-universal-gw-service
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true # Required for self-signed certificates

