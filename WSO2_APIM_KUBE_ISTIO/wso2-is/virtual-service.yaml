apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: is-vs
  namespace: wso2-is
spec:
  hosts:
    - "wso2is.example.com"
  gateways:
    - istio-system/wso2-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: wso2-is-identity-server
            # Mesh-native: route to the PLAINTEXT servlet port (9763). Ingress terminates client
            # TLS; ingress->pod secured by Istio mTLS. No backend TLS origination.
            port:
              number: 9763
# No DestinationRule: IS is single-replica (no affinity needed) and TLS origination is gone under
# mesh-native. Istio mTLS secures the ingress->IS hop.

