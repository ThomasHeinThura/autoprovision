apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: is-vs
  namespace: wso2-is
spec:
  hosts:
    - "wso2is.example.com"
  gateways:
    - istio-system/wso2-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: wso2-is-identity-server
            port:
              number: 9443
---
# DestinationRule for APIM - Enable TLS to backend with self-signed cert support
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: is-dr
  namespace: wso2-is
spec:
  host: wso2-is-identity-server
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true # Required for self-signed certificates
    portLevelSettings:
      - port:
          number: 9443
        tls:
          mode: SIMPLE
          insecureSkipVerify: true

