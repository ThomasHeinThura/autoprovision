# Single shared ambient ingress — Kubernetes Gateway API Gateway (gatewayClassName: istio).
#
# This is the ONE reverse proxy for the whole cluster (the ambient equivalent of a single Ingress
# controller): it provisions exactly ONE LoadBalancer Service 'shared-gateway-istio' in
# istio-system → ONE MetalLB EXTERNAL-IP. Every app (WSO2 CP/gateways/IS, ArgoCD, Headlamp, …)
# attaches its own HTTPRoute by hostname, so they ALL share this single IP — no per-app IPs.
#
# The single catch-all HTTPS listener (no hostname) terminates TLS with `wso2-ingress-cert` and
# serves it for every SNI, so any hostname works without a per-host listener. allowedRoutes: All
# lets HTTPRoutes in any namespace attach. (k8s_addons.yml also creates this same Gateway in the
# istio step so it exists cluster-wide before any app deploys; re-applying here is idempotent.)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wso2-ingress-cert
            namespace: istio-system
      allowedRoutes:
        namespaces:
          from: All
