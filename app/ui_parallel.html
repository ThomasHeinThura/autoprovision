<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autoprovision — Workloads</title>
    <style>
      :root {
        --bg:#eef3f8; --ink:#0f172a; --muted:#64748b; --panel:#fff; --line:#d7e1ee;
        --brand:#0f766e; --brand2:#0d9488; --side:#0b1f33; --side-ink:#cbd5e1;
        --log-bg:#071226; --log-ink:#9bf6c0;
      }
      * { box-sizing:border-box; }
      html,body { height:100%; margin:0; }
      body {
        font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink);
        background:var(--bg); display:flex; flex-direction:column; height:100vh; overflow:hidden;
      }
      header.top {
        display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
      }
      header.top h1 { margin:0; font-size:1.15rem; }
      header.top .sub { color:var(--muted); font-size:.8rem; margin-top:2px; }
      .top-right { display:flex; align-items:flex-end; gap:8px; flex-wrap:wrap; }
      .top-right .fld { display:flex; flex-direction:column; }
      .top-right label { font-size:.68rem; color:var(--muted); font-weight:600; margin-bottom:2px; }
      .top-right input { width:150px; border:1px solid #cbd5e1; border-radius:8px; padding:6px 8px; font-size:.82rem; }
      .btn { border:1px solid var(--brand); border-radius:8px; padding:8px 12px; font-size:.82rem;
        font-weight:700; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand2)); cursor:pointer; }
      .btn.ghost { border-color:#64748b; background:linear-gradient(135deg,#64748b,#475569); }
      .btn.warn  { border-color:#b45309; background:linear-gradient(135deg,#d97706,#b45309); }
      .btn:disabled { opacity:.5; cursor:not-allowed; }

      .body { flex:1; display:grid; grid-template-columns:270px 1fr; min-height:0; }

      /* ── sidebar tabs ── */
      nav.side { background:var(--side); color:var(--side-ink); overflow-y:auto; padding:10px 8px; }
      .grp { margin:6px 4px 2px; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:#7c93ad; }
      .tab { display:flex; align-items:center; justify-content:space-between; gap:8px;
        padding:9px 10px; border-radius:9px; cursor:pointer; font-size:.86rem; color:#e2e8f0; }
      .tab:hover { background:#13314e; }
      .tab.active { background:#15406b; color:#fff; font-weight:700; }
      .dot { width:9px; height:9px; border-radius:50%; background:#475569; flex:0 0 auto; }
      .dot.queued, .dot.running { background:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.25); }
      .dot.completed { background:#22c55e; }
      .dot.partial { background:#f59e0b; }
      .dot.failed { background:#ef4444; }

      /* ── main panel ── */
      main.panel { display:flex; flex-direction:column; min-height:0; padding:14px 16px; }
      .phead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
      .phead h2 { margin:0; font-size:1.15rem; }
      .badge { font-size:.7rem; font-weight:700; padding:3px 10px; border-radius:999px; text-transform:uppercase;
        background:#e2e8f0; color:#475569; }
      .badge.queued,.badge.running { background:#fef3c7; color:#92400e; }
      .badge.completed { background:#dcfce7; color:#166534; }
      .badge.partial { background:#fef3c7; color:#92400e; }
      .badge.failed { background:#fee2e2; color:#991b1b; }
      .step { color:var(--muted); font-size:.8rem; margin-left:auto; }
      .desc { color:var(--muted); font-size:.82rem; margin:4px 0 0; }

      .inputs { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:9px; margin:12px 0; }
      .inputs .fld { display:flex; flex-direction:column; }
      .inputs label { font-size:.74rem; color:#334155; font-weight:600; margin-bottom:4px; }
      .inputs input, .inputs textarea { width:100%; border:1px solid #cbd5e1; border-radius:8px;
        padding:8px 9px; font-size:.84rem; font-family:inherit; }
      .inputs textarea { min-height:54px; resize:vertical; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; }
      .inputs input:focus,.inputs textarea:focus { border-color:#14b8a6; box-shadow:0 0 0 3px rgba(20,184,166,.2); outline:none; }
      .run-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
      .run-row .force { font-size:.78rem; color:var(--muted); display:flex; align-items:center; gap:5px; margin-left:6px; }
      .steps { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 0; }
      .stepchip { font-size:.7rem; padding:2px 8px; border-radius:999px; background:#e2e8f0; color:#475569; }
      .stepchip.completed { background:#dcfce7; color:#166534; }
      .stepchip.failed { background:#fee2e2; color:#991b1b; }

      .logwrap { flex:1; display:flex; flex-direction:column; min-height:0; }
      .logbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
      .logbar .t { font-size:.85rem; font-weight:700; }
      .logbar .meta { font-size:.74rem; color:var(--muted); }
      pre.log { flex:1; margin:0; border:1px solid #1e293b; border-radius:10px; background:var(--log-bg);
        color:var(--log-ink); padding:12px; font-family:ui-monospace,Menlo,Consolas,monospace;
        font-size:.78rem; line-height:1.45; overflow:auto; white-space:pre-wrap; }

      @media (max-width:920px) {
        body { overflow:auto; height:auto; }
        .body { grid-template-columns:1fr; }
        nav.side { display:flex; flex-wrap:wrap; gap:6px; }
        nav.side .grp { width:100%; }
        .tab { background:#13314e; }
        pre.log { min-height:50vh; }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Autoprovision — Workloads</h1>
        <div class="sub">RKE2 + Istio · each workload runs independently in parallel · <a href="/docker" style="color:var(--brand)">legacy page</a></div>
      </div>
      <div class="top-right">
        <div class="fld"><label>SSH User (all)</label><input id="g-user" value="autoprovision" /></div>
        <div class="fld"><label>SSH Password (all)</label><input id="g-pass" type="password" /></div>
        <button class="btn" onclick="runAll()">Run All Configured</button>
        <button class="btn ghost" onclick="reloadSaved()">Reload Saved</button>
      </div>
    </header>

    <div class="body">
      <nav class="side" id="side"></nav>
      <main class="panel">
        <div class="phead">
          <h2 id="p-title">—</h2>
          <span class="badge" id="p-badge">idle</span>
          <span class="step" id="p-step"></span>
        </div>
        <p class="desc" id="p-desc"></p>
        <div class="steps" id="p-steps"></div>
        <div class="inputs" id="p-inputs"></div>
        <div class="run-row">
          <button class="btn" id="p-run" onclick="runActive()">Run</button>
          <button class="btn ghost" onclick="previewActive()">Preview</button>
          <button class="btn ghost" onclick="resetActive()" title="Clear this workload's saved install status so the next Run re-installs every step (use when a step is marked done but is actually broken).">Reset status</button>
          <label class="force"><input type="checkbox" id="p-force" /> Force re-run all steps</label>
        </div>
        <div class="logwrap">
          <div class="logbar"><span class="t">Logs</span><span class="meta" id="p-logmeta">previous run shown until you Run</span></div>
          <pre class="log" id="p-log">Select a workload.</pre>
        </div>
      </main>
    </div>

    <script>
      // ── workload (tab) definitions ──────────────────────────────────────────
      // RKE2 field sets reused across env groups
      const RKE2_UAT_FIELDS = [ {k:"cluster_name", l:"Cluster Name", v:"uat-cluster"},
        {k:"control_plane_ips", l:"Control Plane IP", t:"textarea", ph:"192.168.65.11"},
        {k:"worker_ips", l:"Worker IPs", t:"textarea", ph:"21\n22"}, {k:"rke2_version", l:"RKE2 Version", v:"v1.36.1+rke2r2"},
        {k:"rke2_token", l:"RKE2 Token (not saved)", t:"password"}, {k:"rke2_images_local_dir", l:"Images dir on jump host (optional)", ph:"/home/bimdevops/rke2-images"} ];
      const RKE2_PROD_FIELDS = [ {k:"cluster_name", l:"Cluster Name", v:"prod-cluster"},
        {k:"control_plane_ips", l:"Control Plane IPs (first = bootstrap)", t:"textarea", ph:"11\n12\n13"},
        {k:"worker_ips", l:"Worker IPs", t:"textarea", ph:"21\n22\n23\n24\n25"}, {k:"registration_address", l:"Registration Address / VIP", ph:"rke2-prod.example.local"},
        {k:"rke2_version", l:"RKE2 Version", v:"v1.36.1+rke2r2"}, {k:"rke2_token", l:"RKE2 Token (not saved)", t:"password"},
        {k:"rke2_images_local_dir", l:"Images dir on jump host (optional)", ph:"/home/bimdevops/rke2-images"} ];
      // Build the per-environment in-cluster step set (Istio → ArgoCD → Headlamp → DB → WSO2)
      function envK8s(env, clusterName) {
        const C = {k:"cluster_name", l:"Cluster (kubeconfig)", v:clusterName};
        return [
          { track:env+"_istio", action:"k8s-istio-up", title:"4 · Istio (+HTTPS, MetalLB)",
            desc:"Install MetalLB (LoadBalancer IPs) + Istio (default profile → ingressgateway in istio-system) and the HTTPS TLS secret. Fixes the gateway having no external IP.",
            fields:[ C, {k:"metallb_ip_range", l:"MetalLB IP range (LAN)", ph:"192.168.65.200-192.168.65.220"} ] },
          { track:env+"_argocd", action:"k8s-argocd-up", title:"5 · ArgoCD",
            desc:"Install ArgoCD and expose it over HTTPS via Istio.",
            fields:[ C, {k:"argocd_host", l:"ArgoCD Host", v:"argocd."+env+".example.com"} ] },
          { track:env+"_headlamp", action:"k8s-headlamp-up", title:"6 · Headlamp (optional)",
            desc:"Install Headlamp + expose via Istio. SKIPS automatically if the chart repo is blocked (no failure).",
            fields:[ C, {k:"headlamp_host", l:"Headlamp Host", v:"headlamp."+env+".example.com"} ] },
        ];
      }
      const WSO2_FIELDS = (env, cluster) => [
        {k:"cluster_name", l:"Cluster (kubeconfig)", v:cluster},
        {k:"apim_host", l:"APIM Host", v:"apim."+env+".example.com"},
        {k:"internal_gw_host", l:"Internal GW Host", v:"internal-gw."+env+".example.com"},
        {k:"external_gw_host", l:"External GW Host", v:"external-gw."+env+".example.com"},
        {k:"is_host", l:"IS Host", v:"wso2is."+env+".example.com"},
        {k:"mssql_host", l:"MSSQL host/IP (DB)", ph:"192.168.x.x"},
      ];

      const GROUPS = [
        { label: "GitLab Environment", tabs: [
          { track:"gl_docker", action:"docker-traefik-up", title:"1 · Docker + Traefik",
            desc:"Install Docker CE + Traefik edge proxy on the GitLab VM (owns the shared platform network).",
            fields:[ {k:"docker_ip", l:"GitLab VM IP", ph:"192.168.x.x"} ] },
          { track:"gl_gitlab", action:"gitlab-platform-up", title:"2 · GitLab + SonarQube",
            desc:"PostgreSQL/Dockhand → GitLab CE + Runner + Registry → SonarQube (self-contained: also ensures Docker+Traefik).",
            fields:[ {k:"docker_ip", l:"GitLab VM IP", ph:"192.168.x.x"}, {k:"gitlab_domain", l:"GitLab Domain", v:"gitlab.example.com"},
              {k:"gitlab_registry_domain", l:"Registry Domain", v:"registry.example.com"}, {k:"dockhand_domain", l:"Dockhand Domain", v:"dockhand.example.com"},
              {k:"sonarqube_domain", l:"SonarQube Domain", v:"sonar.example.com"}, {k:"gitlab_runner_token", l:"Runner Token (not saved)", t:"password"} ] },
        ]},
        { label: "UAT Environment", tabs: [
          { track:"uat_docker", action:"docker-traefik-up", title:"1 · Docker + Traefik (ELK VM)",
            desc:"Docker CE + Traefik on the UAT ELK VM.",
            fields:[ {k:"docker_ip", l:"UAT ELK VM IP", ph:"192.168.x.x"} ] },
          { track:"uat_elk", action:"elk-stack-up", title:"2 · ELK",
            desc:"UAT ELK stack (Elasticsearch/Logstash/Kibana/Fleet/APM, Kibana via Traefik).",
            fields:[ {k:"docker_ip", l:"UAT ELK VM IP", ph:"192.168.x.x"}, {k:"kibana_domain", l:"Kibana Domain", v:"kibana-uat.example.com"} ] },
          { track:"uat_rke2", action:"rke2-cluster-up", title:"3 · RKE2 cluster",
            desc:"UAT cluster: 1 control plane + 2 workers, default CNI (Canal).", fields: RKE2_UAT_FIELDS },
          { track:"uat_rke2_scale", action:"rke2-scale-up", title:"3b · RKE2 add/scale nodes",
            desc:"Add control-plane/worker nodes to the existing UAT cluster. List ALL node IPs — already-joined nodes are skipped (install guarded by `creates`), only new IPs join. Always runs (never skipped).",
            fields: RKE2_UAT_FIELDS },
          ...envK8s("uat", "uat-cluster"),
          { track:"uat_db", action:"mssql-ag-up", title:"7 · Database (MSSQL HA AG)",
            desc:"UAT SQL Server 2025 Enterprise HA AG on Ubuntu 24.04 VMs (native + Pacemaker, CLUSTER_TYPE=EXTERNAL, synchronous, automatic failover). First IP = initial primary. List 2–3 nodes. Listener IP = the AG virtual IP WSO2 connects to.",
            fields:[ {k:"mssql_ips", l:"AG Node IPs (first = primary)", t:"textarea", ph:"192.168.65.31\n192.168.65.32\n192.168.65.33"}, {k:"ag_name", l:"AG Name", v:"uatag"},
              {k:"listener_ip", l:"Listener / Virtual IP (optional)", ph:"192.168.65.40"},
              {k:"sa_password", l:"SA Password (not saved)", t:"password"} ] },
          { track:"uat_wso2_apim", action:"k8s-wso2-apim-up", title:"8 · WSO2 APIM",
            desc:"Render the WSO2 repo with UAT hosts + MSSQL URL (no manual CM edits) and apply CP + gateways.",
            fields: WSO2_FIELDS("uat", "uat-cluster") },
          { track:"uat_wso2_is", action:"k8s-wso2-is-up", title:"9 · WSO2 Identity Server",
            desc:"Render + apply WSO2 IS for UAT.", fields: WSO2_FIELDS("uat", "uat-cluster") },
        ]},
        { label: "Prod Environment", tabs: [
          { track:"prod_docker", action:"docker-traefik-up", title:"1 · Docker + Traefik (ELK VM)",
            desc:"Docker CE + Traefik on the Prod ELK VM.",
            fields:[ {k:"docker_ip", l:"Prod ELK VM IP", ph:"192.168.x.x"} ] },
          { track:"prod_elk", action:"elk-stack-up", title:"2 · ELK",
            desc:"Production ELK stack.",
            fields:[ {k:"docker_ip", l:"Prod ELK VM IP", ph:"192.168.x.x"}, {k:"kibana_domain", l:"Kibana Domain", v:"kibana.example.com"} ] },
          { track:"prod_rke2", action:"rke2-cluster-up", title:"3 · RKE2 cluster",
            desc:"Prod cluster: 3 control planes + 5 workers, default CNI (Canal). Use a registration address/VIP.", fields: RKE2_PROD_FIELDS },
          { track:"prod_rke2_scale", action:"rke2-scale-up", title:"3b · RKE2 add/scale nodes",
            desc:"Grow the Prod cluster (1–5 control planes, 2–100 workers). List ALL node IPs — already-joined nodes are skipped, new IPs join automatically. Use the registration address/VIP so new CP/workers join one stable endpoint. Always runs.",
            fields: RKE2_PROD_FIELDS },
          ...envK8s("prod", "prod-cluster"),
          { track:"prod_db", action:"mssql-ag-up", title:"7 · Database (MSSQL HA AG)",
            desc:"Prod SQL Server 2025 Enterprise 3-node HA AG on Ubuntu 24.04 VMs (native + Pacemaker, CLUSTER_TYPE=EXTERNAL, 3 synchronous replicas, automatic failover). First IP = initial primary. Listener IP = the AG virtual IP WSO2 connects to. Configure real fencing for production.",
            fields:[ {k:"mssql_ips", l:"AG Node IPs (first = primary)", t:"textarea", ph:"192.168.51.31\n192.168.51.32\n192.168.51.33"}, {k:"ag_name", l:"AG Name", v:"prodag"},
              {k:"listener_ip", l:"Listener / Virtual IP", ph:"192.168.51.40"},
              {k:"sa_password", l:"SA Password (not saved)", t:"password"} ] },
          { track:"prod_wso2_apim", action:"k8s-wso2-apim-up", title:"8 · WSO2 APIM",
            desc:"Render the WSO2 repo with Prod hosts + MSSQL URL and apply CP + gateways.",
            fields: WSO2_FIELDS("prod", "prod-cluster") },
          { track:"prod_wso2_is", action:"k8s-wso2-is-up", title:"9 · WSO2 Identity Server",
            desc:"Render + apply WSO2 IS for Prod.", fields: WSO2_FIELDS("prod", "prod-cluster") },
        ]},
        { label: "Certificates", tabs: [
          { track:"traefik_cert", action:"traefik-cert-apply", title:"Certificate — Traefik",
            desc:"Push a TLS cert+key to the Traefik VMs and use it as the well-known default certificate for ALL routers. Re-run to update/rotate. Traefik must already be installed on each VM.",
            fields:[ {k:"docker_ips", l:"Traefik VM IPs (apply to all)", t:"textarea", ph:"GitLab VM IP\nUAT ELK VM IP\nProd ELK VM IP"},
              {k:"cert_pem", l:"Certificate PEM (not saved)", t:"textarea", ph:"-----BEGIN CERTIFICATE-----"},
              {k:"key_pem", l:"Private Key PEM (not saved)", t:"textarea", ph:"-----BEGIN PRIVATE KEY-----"} ] },
          { track:"k8s_certmanager", action:"k8s-certmanager-up", title:"cert-manager (internal CA)",
            desc:"One-time per cluster: install cert-manager + a self-signed root CA (ca-issuer ClusterIssuer). After this, the 'Certificate — Kubernetes' workload with EMPTY PEM fields auto-issues + auto-renews the secret from the internal CA. Import ca.crt (secret internal-ca-secret, ns cert-manager) into clients to trust it.",
            fields:[ {k:"cluster_name", l:"Cluster (kubeconfig name)", v:"uat-cluster"} ] },
          { track:"k8s_cert", action:"k8s-cert-secret", title:"Certificate — Kubernetes",
            desc:"Create/update a TLS secret in a specific RKE2 cluster (e.g. wso2-ingress-cert in istio-system for Istio/WSO2). PASTE a PEM to use your own cert (re-run yearly to rotate). LEAVE PEMs EMPTY to have cert-manager issue + auto-renew it from the internal CA (run the cert-manager workload first).",
            fields:[ {k:"cluster_name", l:"Cluster (kubeconfig name)", v:"uat-cluster"}, {k:"namespace", l:"Namespace", v:"istio-system"},
              {k:"secret_name", l:"Secret Name", v:"wso2-ingress-cert"},
              {k:"cert_pem", l:"Certificate PEM (empty → cert-manager)", t:"textarea", ph:"-----BEGIN CERTIFICATE-----"},
              {k:"key_pem", l:"Private Key PEM (empty → cert-manager)", t:"textarea", ph:"-----BEGIN PRIVATE KEY-----"} ] },
        ]},
      ];
      const TABS = {}; GROUPS.forEach(g => g.tabs.forEach(t => TABS[t.track] = t));
      const PRIMARY = { docker_ip:1, mssql_ip:1, mssql_ips:1, control_plane_ips:1 }; // any present => "configured"

      const values = {};   // track -> {field: value}
      const state  = {};   // track -> {jobId,status,step,log,loadedPrev}
      let active = GROUPS[0].tabs[0].track;

      const $ = id => document.getElementById(id);
      function gUser(){ return $("g-user").value.trim() || "autoprovision"; }
      function gPass(){ return $("g-pass").value; }

      function initValues() {
        Object.values(TABS).forEach(t => {
          values[t.track] = values[t.track] || {};
          t.fields.forEach(f => { if (values[t.track][f.k] === undefined) values[t.track][f.k] = f.v || ""; });
          state[t.track] = state[t.track] || { jobId:null, status:"idle", step:"", log:"", loadedPrev:false };
        });
      }

      // ── sidebar ──────────────────────────────────────────────────────────────
      function renderSide() {
        const side = $("side"); side.innerHTML = "";
        GROUPS.forEach(g => {
          const gl = document.createElement("div"); gl.className = "grp"; gl.textContent = g.label; side.appendChild(gl);
          g.tabs.forEach(t => {
            const st = state[t.track];
            const el = document.createElement("div");
            el.className = "tab" + (t.track === active ? " active" : "");
            el.onclick = () => selectTab(t.track);
            el.innerHTML = `<span>${t.title}</span><span class="dot ${st.status}"></span>`;
            side.appendChild(el);
          });
        });
      }
      function updateBadges() {
        // refresh sidebar dots without rebuilding
        const tabsEls = $("side").querySelectorAll(".tab");
        let i = 0;
        GROUPS.forEach(g => g.tabs.forEach(t => {
          const dot = tabsEls[i] && tabsEls[i].querySelector(".dot");
          if (dot) dot.className = "dot " + state[t.track].status;
          i++;
        }));
      }

      // ── main panel ────────────────────────────────────────────────────────────
      function selectTab(track) {
        active = track; renderSide(); renderPanel();
        const f = $("p-force"); if (f) f.checked = false;
        const st = state[track];
        if (!st.log && !st.loadedPrev) loadPrevLog(track);
      }

      async function loadStatus() {
        try {
          const r = await fetch("/tracks/status"); if (!r.ok) return;
          const data = await r.json();
          Object.entries(data).forEach(([track, info]) => {
            if (!state[track]) return;
            if (["queued","running"].includes(state[track].status)) return; // don't clobber a live run
            state[track].status = info.status || state[track].status;
            state[track].steps = info.steps || {};
          });
          updateBadges();
          if (active && state[active]) renderSteps(), setBadge(state[active].status);
        } catch (_) {}
      }

      function renderSteps() {
        const box = $("p-steps"); box.innerHTML = "";
        const steps = state[active].steps || {};
        Object.entries(steps).forEach(([label, s]) => {
          const c = document.createElement("span"); c.className = "stepchip " + s;
          c.textContent = (s === "completed" ? "✓ " : s === "failed" ? "✗ " : "") + label;
          box.appendChild(c);
        });
      }

      function renderPanel() {
        const t = TABS[active], st = state[active];
        $("p-title").textContent = t.title;
        $("p-desc").textContent = t.desc;
        setBadge(st.status); $("p-step").textContent = st.step ? "Step: " + st.step : "";
        renderSteps();
        $("p-run").disabled = (st.status === "queued" || st.status === "running");
        // inputs
        const box = $("p-inputs"); box.innerHTML = "";
        t.fields.forEach(f => {
          const wrap = document.createElement("div"); wrap.className = "fld";
          const lab = document.createElement("label"); lab.textContent = f.l; wrap.appendChild(lab);
          const inp = document.createElement(f.t === "textarea" ? "textarea" : "input");
          if (f.t && f.t !== "textarea") inp.type = f.t;
          if (f.ph) inp.placeholder = f.ph;
          inp.value = values[active][f.k] || "";
          inp.oninput = () => { values[active][f.k] = inp.value; };
          wrap.appendChild(inp); box.appendChild(wrap);
        });
        $("p-log").textContent = st.log || "No log yet. Click Preview to see the plan, or Run to start.";
        $("p-logmeta").textContent = st.status === "idle" && st.log ? "previous run" : (st.status || "");
      }
      function setBadge(s){ const b=$("p-badge"); b.textContent=s; b.className="badge "+s; }

      function payloadFor(track, force) {
        return Object.assign({ track, ssh_user:gUser(), ssh_pass:gPass(), force: !!force }, values[track]);
      }

      async function loadPrevLog(track) {
        state[track].loadedPrev = true;
        try {
          const r = await fetch("/tracks/log/" + track); if (!r.ok) return;
          const d = await r.json();
          if (d.log && d.log.trim()) { state[track].log = d.log; if (active === track) renderPanel(); }
        } catch (_) {}
      }

      async function previewActive() {
        const t = TABS[active];
        $("p-log").textContent = "Loading plan…";
        try {
          const r = await fetch("/tracks/preview", { method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ action:t.action, payload:payloadFor(active) }) });
          const d = await r.json();
          state[active].log = r.ok ? `${d.message}\n\n${d.plan}` : (d.error || JSON.stringify(d));
          renderPanel();
        } catch (e) { state[active].log = "Error: " + e; renderPanel(); }
      }

      function runActive(){ runTrack(active, $("p-force").checked); }

      async function resetActive() {
        const track = active, t = TABS[track], st = state[track];
        if (!confirm(`Clear saved install status for "${t.title || track}"?\nThe next Run will re-install every step.`)) return;
        try {
          const r = await fetch("/tracks/reset", { method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ track }) });
          const d = await r.json();
          if (!r.ok) { st.log = "Reset failed: " + (d.error || JSON.stringify(d)); renderPanel(); return; }
          st.status = "idle"; st.step = "";
          st.log = `Cleared ${d.cleared} saved step(s). Click Run to re-install from scratch.`;
          renderPanel(); updateBadges();
        } catch (e) { st.log = "Reset error: " + e; renderPanel(); }
      }
      async function runTrack(track, force) {
        const t = TABS[track], st = state[track];
        st.status = "queued"; st.step = ""; st.log = "Queued…";
        if (active === track) renderPanel(); updateBadges();
        saveTarget(track);
        try {
          const r = await fetch("/tracks/start", { method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ action:t.action, payload:payloadFor(track, force) }) });
          const d = await r.json();
          if (!r.ok) { st.status="failed"; st.log = d.error || JSON.stringify(d); if(active===track) renderPanel(); updateBadges(); return; }
          st.jobId = d.job_id; pollTrack(track, d.job_id);
        } catch (e) { st.status="failed"; st.log="Error: "+e; if(active===track) renderPanel(); updateBadges(); }
      }

      async function pollTrack(track, jobId) {
        const st = state[track];
        while (true) {
          try {
            const r = await fetch("/tracks/job/" + jobId); if (!r.ok) { st.log += `\nJob fetch failed ${r.status}`; break; }
            const d = await r.json();
            st.status = d.status; st.step = d.step || ""; st.log = d.log || st.log;
            if (d.error) st.log += "\n\nError: " + d.error;
            if (active === track) renderPanel(); updateBadges();
            if (d.status === "completed" || d.status === "failed") break;
          } catch (e) { st.log += "\nPolling error: " + e; break; }
          await new Promise(r => setTimeout(r, 1500));
        }
        if (active === track) { renderPanel(); } updateBadges();
        loadStatus();   // refresh persisted per-step status (chips) after the run settles
      }

      function runAll() {
        Object.values(TABS).forEach(t => {
          const v = values[t.track] || {};
          const configured = Object.keys(PRIMARY).some(k => (v[k] || "").trim());
          const busy = ["queued","running"].includes(state[t.track].status);
          if (configured && !busy) runTrack(t.track);
        });
      }

      async function saveTarget(track) {
        try { await fetch("/state/targets", { method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ track, data: values[track] }) }); } catch (_) {}
      }

      async function reloadSaved() {
        try {
          const r = await fetch("/state/targets"); if (!r.ok) return;
          const data = await r.json();
          Object.entries(data).forEach(([track, vals]) => {
            if (!values[track]) return;
            Object.entries(vals).forEach(([k,v]) => { if (v !== "" && v !== undefined) values[track][k] = v; });
          });
          renderPanel();
        } catch (_) {}
      }

      // ── boot ──
      initValues();
      renderSide();
      Promise.all([reloadSaved(), loadStatus()]).then(() => { renderPanel(); loadPrevLog(active); });
    </script>
  </body>
</html>
