<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autoprovision Control Plane — Parallel</title>
    <style>
      :root {
        --bg: #f3f7fb;
        --ink: #0f172a;
        --muted: #475569;
        --panel: #ffffff;
        --line: #d7e1ee;
        --brand: #0f766e;
        --brand-2: #0d9488;
        --brand-3: #155e75;
        --log-bg: #071226;
        --log-ink: #93f5bf;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 0% -10%, #dbeafe 0%, transparent 40%),
          radial-gradient(circle at 100% 0%, #ccfbf1 0%, transparent 35%),
          var(--bg);
      }
      .shell { max-width: 1500px; margin: 0 auto; padding: 16px; }
      .hero {
        border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
        padding: 16px 18px; box-shadow: 0 10px 26px rgba(15,23,42,.06);
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      }
      .hero h1 { margin: 0; font-size: clamp(1.3rem, 2.2vw, 1.8rem); }
      .hero p { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
      .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .global { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
      .grid {
        margin-top: 14px; display: grid; gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        box-shadow: 0 6px 20px rgba(15,23,42,.05); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .card-head h2 { margin: 0; font-size: 1.02rem; }
      .card-head .sub { font-size: .76rem; color: var(--muted); }
      .badge { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
        text-transform: uppercase; letter-spacing: .03em; background: #e2e8f0; color: #475569; white-space: nowrap; }
      .badge.queued, .badge.running { background: #fef3c7; color: #92400e; }
      .badge.completed { background: #dcfce7; color: #166534; }
      .badge.failed { background: #fee2e2; color: #991b1b; }
      .fields { display: grid; gap: 8px; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      label { display: block; margin-bottom: 4px; font-size: .76rem; color: #334155; font-weight: 600; }
      input, select, textarea {
        width: 100%; border: 1px solid #cbd5e1; border-radius: 9px; padding: 8px 9px; font-size: .85rem; outline: none;
        font-family: inherit;
      }
      textarea { min-height: 52px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; }
      input:focus, select:focus, textarea:focus { border-color: #14b8a6; box-shadow: 0 0 0 3px rgba(20,184,166,.2); }
      .btns { display: flex; gap: 8px; }
      .btn { flex: 1; border: 1px solid #0f766e; border-radius: 9px; padding: 9px; font-size: .85rem;
        font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); cursor: pointer; }
      .btn.ghost { border-color: #64748b; background: linear-gradient(135deg, #64748b, #475569); }
      .btn.small { flex: 0 0 auto; padding: 9px 12px; }
      .btn:hover { filter: brightness(1.04); }
      .btn:disabled { opacity: .55; cursor: not-allowed; filter: none; }
      .steprow { font-size: .76rem; color: var(--muted); min-height: 1em; }
      .log { border: 1px solid #1e293b; border-radius: 10px; background: var(--log-bg); color: var(--log-ink);
        padding: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .74rem; line-height: 1.4;
        height: 180px; overflow: auto; white-space: pre-wrap; }
      .topbtn { border: 1px solid #0f766e; border-radius: 9px; padding: 9px 14px; font-size: .85rem; font-weight: 700;
        color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); cursor: pointer; }
      .topbtn.warn { border-color: #b45309; background: linear-gradient(135deg, #d97706, #b45309); }
      .topbtn.ghost { border-color: #64748b; background: linear-gradient(135deg, #64748b, #475569); }
      a.legacy { color: var(--brand-3); font-size: .82rem; }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <h1>Autoprovision Control Plane — Parallel</h1>
          <p>RKE2 + Istio. Run all tracks at once — each runs independently with its own inventory and log.
             <a class="legacy" href="/docker">Legacy single-Docker page →</a></p>
        </div>
        <div class="hero-actions">
          <button class="topbtn" type="button" onclick="runAll()">Run All Configured</button>
          <button class="topbtn ghost" type="button" onclick="loadTargets()">Reload Saved</button>
        </div>
      </section>

      <section class="global">
        <div>
          <label>Default SSH User (prefills cards)</label>
          <input id="g-ssh-user" value="autoprovision" />
        </div>
        <div>
          <label>Default SSH Password (prefills cards, not saved)</label>
          <input id="g-ssh-pass" type="password" />
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button class="topbtn ghost" type="button" style="width:100%" onclick="applyDefaults()">Apply Defaults To Cards</button>
        </div>
      </section>

      <section class="grid" id="grid"></section>
    </main>

    <script>
      // ── track definitions ───────────────────────────────────────────────────
      const TRACKS = [
        {
          track: "gitlab", action: "gitlab-platform-up",
          title: "GitLab (shared)", sub: "base → platform → GitLab → SonarQube",
          fields: [
            { key: "docker_ip", label: "GitLab VM IP", ph: "192.168.x.x" },
            { key: "gitlab_domain", label: "GitLab Domain", val: "gitlab.example.com" },
            { key: "gitlab_registry_domain", label: "Registry Domain", val: "registry.example.com" },
            { key: "dockhand_domain", label: "Dockhand Domain", val: "dockhand.example.com" },
            { key: "sonarqube_domain", label: "SonarQube Domain", val: "sonar.example.com" },
            { key: "gitlab_runner_token", label: "Runner Token (optional, not saved)", type: "password" },
          ],
        },
        {
          track: "prod_k8s", action: "rke2-cluster-up",
          title: "Prod RKE2 Cluster", sub: "3 control plane + 5 workers · default CNI (Canal)",
          fields: [
            { key: "cluster_name", label: "Cluster Name", val: "prod-cluster" },
            { key: "control_plane_ips", label: "Control Plane IPs (first = bootstrap)", type: "textarea", ph: "11\n12\n13" },
            { key: "worker_ips", label: "Worker IPs", type: "textarea", ph: "21\n22\n23\n24\n25" },
            { key: "registration_address", label: "Registration Address / VIP (optional)", ph: "rke2-prod.example.local" },
            { key: "rke2_version", label: "RKE2 Version", val: "v1.36.1+rke2r2" },
            { key: "rke2_token", label: "RKE2 Token (not saved)", type: "password" },
          ],
        },
        {
          track: "uat_k8s", action: "rke2-cluster-up",
          title: "UAT RKE2 Cluster", sub: "1 control plane + 2 workers · default CNI (Canal)",
          fields: [
            { key: "cluster_name", label: "Cluster Name", val: "uat-cluster" },
            { key: "control_plane_ips", label: "Control Plane IP", type: "textarea", ph: "192.168.65.11" },
            { key: "worker_ips", label: "Worker IPs", type: "textarea", ph: "21\n22" },
            { key: "rke2_version", label: "RKE2 Version", val: "v1.36.1+rke2r2" },
            { key: "rke2_token", label: "RKE2 Token (not saved)", type: "password" },
          ],
        },
        {
          track: "prod_elk", action: "elk-stack-up",
          title: "Prod ELK", sub: "Docker base → ELK + Fleet + APM",
          fields: [
            { key: "docker_ip", label: "ELK VM IP", ph: "192.168.x.x" },
            { key: "kibana_domain", label: "Kibana Domain", val: "kibana.example.com" },
          ],
        },
        {
          track: "uat_elk", action: "elk-stack-up",
          title: "UAT ELK", sub: "Docker base → ELK + Fleet + APM",
          fields: [
            { key: "docker_ip", label: "ELK VM IP", ph: "192.168.x.x" },
            { key: "kibana_domain", label: "Kibana Domain", val: "kibana-uat.example.com" },
          ],
        },
        {
          track: "prod_sql", action: "mssql-ag-up",
          title: "Prod MSSQL AG", sub: "3 nodes · SQL Server 2022 Always On AG",
          fields: [
            { key: "mssql_ips", label: "AG Node IPs (first = primary)", type: "textarea", ph: "31\n32\n33" },
            { key: "ag_name", label: "AG Name", val: "ag1" },
            { key: "sa_password", label: "SA Password (not saved)", type: "password" },
          ],
        },
        {
          track: "uat_sql", action: "mssql-single-up",
          title: "UAT MSSQL", sub: "single SQL Server 2022 instance",
          fields: [
            { key: "mssql_ip", label: "MSSQL VM IP", ph: "192.168.x.x" },
            { key: "sa_password", label: "SA Password (not saved)", type: "password" },
          ],
        },
      ];

      const grid = document.getElementById("grid");
      const activeJobs = {}; // track -> job_id

      function el(tag, attrs = {}, children = []) {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") e.className = v;
          else if (k === "html") e.innerHTML = v;
          else e.setAttribute(k, v);
        }
        for (const c of [].concat(children)) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        return e;
      }

      function buildCard(def) {
        const card = el("div", { class: "card", "data-track": def.track, "data-action": def.action });

        const badge = el("span", { class: "badge", id: `badge-${def.track}` }, "idle");
        const head = el("div", { class: "card-head" }, [
          el("div", {}, [el("h2", {}, def.title), el("div", { class: "sub" }, def.sub)]),
          badge,
        ]);
        card.appendChild(head);

        const fields = el("div", { class: "fields" });
        for (const f of def.fields) {
          const wrap = el("div", {});
          wrap.appendChild(el("label", {}, f.label));
          let input;
          if (f.type === "textarea") {
            input = el("textarea", { "data-field": f.key });
            if (f.ph) input.placeholder = f.ph;
          } else {
            input = el("input", { "data-field": f.key, type: f.type || "text" });
            if (f.ph) input.placeholder = f.ph;
            if (f.val) input.value = f.val;
          }
          wrap.appendChild(input);
          fields.appendChild(wrap);
        }
        // per-card SSH creds
        const sshRow = el("div", { class: "row2" });
        const u = el("div", {}, [el("label", {}, "SSH User")]);
        const uIn = el("input", { "data-field": "ssh_user", value: "autoprovision" });
        u.appendChild(uIn);
        const p = el("div", {}, [el("label", {}, "SSH Password")]);
        const pIn = el("input", { "data-field": "ssh_pass", type: "password" });
        p.appendChild(pIn);
        sshRow.appendChild(u); sshRow.appendChild(p);
        fields.appendChild(sshRow);
        card.appendChild(fields);

        const btns = el("div", { class: "btns" });
        const runBtn = el("button", { class: "btn", id: `run-${def.track}` }, "Run");
        runBtn.addEventListener("click", () => runTrack(def.track));
        const prevBtn = el("button", { class: "btn ghost small" }, "Preview");
        prevBtn.addEventListener("click", () => previewTrack(def.track));
        btns.appendChild(runBtn); btns.appendChild(prevBtn);
        card.appendChild(btns);

        card.appendChild(el("div", { class: "steprow", id: `step-${def.track}` }, ""));
        card.appendChild(el("pre", { class: "log", id: `log-${def.track}` }, "No run yet."));
        return card;
      }

      function cardEl(track) { return grid.querySelector(`.card[data-track="${track}"]`); }
      function collectPayload(track) {
        const card = cardEl(track);
        const payload = { track };
        card.querySelectorAll("[data-field]").forEach((i) => { payload[i.getAttribute("data-field")] = i.value.trim(); });
        return payload;
      }
      function setBadge(track, status) {
        const b = document.getElementById(`badge-${track}`);
        b.textContent = status;
        b.className = `badge ${status}`;
      }
      function setLog(track, text) { document.getElementById(`log-${track}`).textContent = text; }
      function setStep(track, text) { document.getElementById(`step-${track}`).textContent = text || ""; }

      async function saveTarget(track, payload) {
        try {
          await fetch("/state/targets", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ track, data: payload }),
          });
        } catch (_) {}
      }

      async function previewTrack(track) {
        const card = cardEl(track);
        const payload = collectPayload(track);
        setLog(track, "Loading preview...");
        try {
          const r = await fetch("/tracks/preview", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: card.getAttribute("data-action"), payload }),
          });
          const d = await r.json();
          if (!r.ok) { setLog(track, d.error || JSON.stringify(d)); return; }
          setLog(track, `${d.message}\n\n${d.plan}`);
        } catch (e) { setLog(track, `Error: ${e}`); }
      }

      async function runTrack(track) {
        const card = cardEl(track);
        const payload = collectPayload(track);
        const runBtn = document.getElementById(`run-${track}`);
        runBtn.disabled = true;
        setBadge(track, "queued");
        setStep(track, "");
        setLog(track, "Queued...");
        saveTarget(track, payload);
        try {
          const r = await fetch("/tracks/start", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: card.getAttribute("data-action"), payload }),
          });
          const d = await r.json();
          if (!r.ok) { setBadge(track, "failed"); setLog(track, d.error || JSON.stringify(d)); runBtn.disabled = false; return; }
          activeJobs[track] = d.job_id;
          pollTrack(track, d.job_id);
        } catch (e) { setBadge(track, "failed"); setLog(track, `Error: ${e}`); runBtn.disabled = false; }
      }

      async function pollTrack(track, jobId) {
        const runBtn = document.getElementById(`run-${track}`);
        let done = false;
        while (!done) {
          try {
            const r = await fetch(`/tracks/job/${jobId}`);
            if (!r.ok) { setLog(track, `Job fetch failed: ${r.status}`); break; }
            const d = await r.json();
            setBadge(track, d.status);
            setStep(track, d.step ? `Step: ${d.step}` : "");
            setLog(track, d.log || "Waiting for logs...");
            if (d.status === "completed" || d.status === "failed") {
              if (d.error) setLog(track, `${d.log || ""}\n\nError: ${d.error}`);
              done = true;
            }
          } catch (e) { setLog(track, `Polling error: ${e}`); break; }
          if (!done) await new Promise((res) => setTimeout(res, 1500));
        }
        runBtn.disabled = false;
        delete activeJobs[track];
      }

      function runAll() {
        for (const def of TRACKS) {
          const p = collectPayload(def.track);
          // Only auto-run tracks that have their primary target filled in.
          const hasTarget = p.docker_ip || p.mssql_ip || p.mssql_ips || p.control_plane_ips;
          if (hasTarget && !activeJobs[def.track]) runTrack(def.track);
        }
      }

      function applyDefaults() {
        const u = document.getElementById("g-ssh-user").value.trim();
        const p = document.getElementById("g-ssh-pass").value;
        TRACKS.forEach((def) => {
          const card = cardEl(def.track);
          const uIn = card.querySelector('[data-field="ssh_user"]');
          const pIn = card.querySelector('[data-field="ssh_pass"]');
          if (u) uIn.value = u;
          if (p) pIn.value = p;
        });
      }

      async function loadTargets() {
        try {
          const r = await fetch("/state/targets");
          if (!r.ok) return;
          const data = await r.json();
          for (const [track, vals] of Object.entries(data)) {
            const card = cardEl(track);
            if (!card) continue;
            card.querySelectorAll("[data-field]").forEach((i) => {
              const k = i.getAttribute("data-field");
              if (vals[k] !== undefined && vals[k] !== "") i.value = vals[k];
            });
          }
        } catch (_) {}
      }

      // build cards then load saved values
      TRACKS.forEach((def) => grid.appendChild(buildCard(def)));
      loadTargets();
    </script>
  </body>
</html>
