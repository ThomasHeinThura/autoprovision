# Frontend on the shared-gateway (istio-system) — same pattern as ../../echo.yaml.
# The SPA's /bff and /realtime are proxied to app3 by its own nginx, so one host is enough.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: taskdesk
spec:
  parentRefs:
    - name: shared-gateway
      namespace: istio-system
  hostnames:
    - taskdesk.example.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          port: 80
