apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskdesk
  labels: { app: frontend, part-of: taskdesk }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, part-of: taskdesk }
    spec:
      containers:
        - name: frontend
          image: taskdesk/frontend:latest   # nginx serving the SPA; proxies /bff + /realtime → app3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
