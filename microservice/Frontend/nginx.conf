server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # BFF (app3) — same-origin so the SPA uses relative /bff/* URLs.
  location /bff/ {
    proxy_pass http://app3:8082;
    proxy_set_header Host $host;
  }

  # Realtime WebSocket (app3).
  location /realtime {
    proxy_pass http://app3:8082;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # Static HTML prototype kept available for reference.
  location /ui/ { }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
