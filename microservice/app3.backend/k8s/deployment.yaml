apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-node
  namespace: taskdesk
  labels: { app: app3-node, part-of: taskdesk }
spec:
  replicas: 1
  selector:
    matchLabels: { app: app3-node }
  template:
    metadata:
      labels: { app: app3-node, part-of: taskdesk }
    spec:
      containers:
        - name: app3-node
          image: taskdesk/app3-node:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: API_BASE
              value: "http://app1-dotnet"      # app1 Service (port 80)
            - name: REDIS_ADDR
              value: "valkey:6379"
          readinessProbe:
            httpGet: { path: /readyz, port: 8082 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
