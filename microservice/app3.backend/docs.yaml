openapi: 3.1.0
info:
  title: TaskDesk BFF + Realtime (app3)
  version: 1.0.0
  description: >
    Backend-for-frontend. Aggregates the core API (app1) and the workers' cached
    report (Valkey) into view-shaped responses, and fans out realtime events over
    a WebSocket at /realtime. Writes are proxied to app1, then broadcast.
servers:
- url: http://localhost:8082/
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200': { description: OK }
  /readyz:
    get:
      summary: Readiness probe (checks app1 + Valkey)
      responses:
        '200': { description: Ready }
        '503': { description: Degraded }
  /bff/overview:
    get:
      summary: Aggregated overview (projects + cached report + totals)
      parameters:
      - { name: customer, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
                  report: { type: [object, 'null'] }
                  totals:
                    type: object
                    properties:
                      projects: { type: integer }
                      open: { type: integer }
                      resolved: { type: integer }
                  realtime: { type: boolean }
        '502': { description: Upstream (app1) error }
  /bff/projects:
    get:
      summary: Project summaries (pass-through of app1 /api/v1/projects)
      parameters:
      - { name: customer, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        '502': { description: Upstream error }
  /bff/projects/{key}/board:
    get:
      summary: Work items grouped into board columns (todo/prog/wait/done)
      parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  columns: { type: array, items: { type: string } }
                  board: { type: object }
                  count: { type: integer }
        '502': { description: Upstream error }
  /bff/workitems/{key}:
    get:
      summary: Single work item (includes slaState + slaDueAt)
      parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '502': { description: Upstream error }
  /bff/projects/{key}/contract:
    get:
      summary: Managed-service contract + hour bank (§7). 403 when managed_service module is off.
      parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '403': { description: module_disabled }
        '502': { description: Upstream error }
  /bff/modules:
    get:
      summary: Feature modules
      parameters:
      - { name: customer, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }
        '502': { description: Upstream error }
  /bff/workitems:
    post:
      summary: Create a work item (proxied to app1, then broadcast)
      requestBody:
        content:
          application/json: {}
      responses:
        '200': { description: Created }
        '502': { description: Upstream error }
  /bff/workitems/{key}/transition:
    post:
      summary: Transition a work item's status
      parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json: {}
      responses:
        '200': { description: OK }
        '502': { description: Upstream error }
  /bff/workitems/{key}/assign:
    post:
      summary: Assign (or unassign) a work item
      parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json: { schema: { type: object, properties: { assignee: { type: [string, 'null'] } } } }
      responses:
        '200': { description: OK }
        '502': { description: Upstream error }
  /bff/workitems/{key}/time:
    post:
      summary: Log time against a work item (deducts from hour bank; managed_service-gated)
      parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json: { schema: { type: object, properties: { author: { type: string }, minutes: { type: integer }, note: { type: string } } } }
      responses:
        '200': { description: OK }
        '403': { description: module_disabled }
        '502': { description: Upstream error }
  /bff/workitems/{key}/comments:
    post:
      summary: Add a comment to a work item
      parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json: {}
      responses:
        '200': { description: OK }
        '502': { description: Upstream error }
  /realtime:
    get:
      summary: WebSocket endpoint (event fan-out). Not a plain HTTP GET — upgrade required.
      responses:
        '101': { description: Switching Protocols (WebSocket) }
  /api/docs.yaml:
    get:
      summary: This OpenAPI document (YAML)
      responses:
        '200':
          description: OK
          content:
            application/yaml: {}
components:
  schemas:
    ProjectSummary:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        customer: { type: string }
        customerKey: { type: string }
        type: { type: string }
        serviceType: { type: string }
        lead: { type: string }
        open: { type: integer }
        resolved: { type: integer }
