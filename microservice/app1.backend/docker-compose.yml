# One-command local run of the core API (PLAN §24 "very good setup").
#   docker compose up --build   →   http://localhost:8080/api/v1/projects
services:
  app1:
    build: .
    image: taskdesk/app1-dotnet:dev
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      DB_PATH: /data/taskdesk.db
    volumes:
      - taskdesk-data:/data

volumes:
  taskdesk-data:
