apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-dotnet
  namespace: taskdesk
  labels: { app: app1-dotnet, part-of: taskdesk }
spec:
  replicas: 1
  selector:
    matchLabels: { app: app1-dotnet }
  template:
    metadata:
      labels: { app: app1-dotnet, part-of: taskdesk }
    spec:
      containers:
        - name: app1-dotnet
          # Replace with your registry/tag; built from microservice/app1.backend/Dockerfile.
          image: taskdesk/app1-dotnet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DB_PATH
              # SQLite for the vertical slice. For prod, switch the EF provider to Postgres/MSSQL
              # (PLAN §19 Q7) and drop this volume in favour of a connection-string Secret.
              value: "/data/taskdesk.db"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          emptyDir: {}
