# Attaches to the cluster-wide shared-gateway (istio-system) — same pattern as ../../echo.yaml.
# Public/partner traffic should instead be fronted by WSO2 APIM (PLAN §10); this route is the
# in-mesh / frontend path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app1-dotnet
  namespace: taskdesk
spec:
  parentRefs:
    - name: shared-gateway
      namespace: istio-system
  hostnames:
    - api.taskdesk.example.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: app1-dotnet
          port: 80
