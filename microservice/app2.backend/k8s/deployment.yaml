apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-go
  namespace: taskdesk
  labels: { app: app2-go, part-of: taskdesk }
spec:
  replicas: 1
  selector:
    matchLabels: { app: app2-go }
  template:
    metadata:
      labels: { app: app2-go, part-of: taskdesk }
    spec:
      containers:
        - name: app2-go
          image: taskdesk/app2-go:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: API_BASE
              value: "http://app1-dotnet"          # in-cluster Service (port 80)
            - name: REDIS_ADDR
              value: "valkey:6379"
            - name: SCAN_INTERVAL
              value: "30s"
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
