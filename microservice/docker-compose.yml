# TaskDesk — full local stack for your Mac.
#
#   docker compose build      # build all images
#   docker compose up -d      # start the stack
#   docker compose ps         # see status
#   docker compose down       # stop (add -v to wipe the DB volume)
#
# Once up:
#   Frontend (React SPA) → http://localhost:8088          (static prototype still at /ui)
#   BFF + realtime (app3)→ http://localhost:8082/bff/overview   ·   ws /realtime
#   Core API (app1)      → http://localhost:8080/api/v1/projects   ·   /openapi/v1.json
#   Workers (app2)       → http://localhost:8081/workers/status    ·   /reports/overview
#   Valkey               → localhost:6379
#   MSSQL (SQL Server)   → localhost:1433   (sa / 1qaz!QAZ, db "taskdesk" auto-created by app1)
#
# Flow: React → nginx (/bff,/realtime proxy) → app3 → app1 → MSSQL;  app2 → Valkey pub/sub → app3 → browser.
# app1 waits for MSSQL to be healthy, then EnsureCreated builds the schema + seeds demo data.
# First run is slow: pulls .NET/Go/Node base images AND the ~1.5GB SQL Server image (amd64, emulated).
# Not yet in the stack (not built): Keycloak (auth, Phase 4).
name: taskdesk

services:
  valkey:
    image: valkey/valkey:7.2.5-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64            # SQL Server image is amd64-only → runs under emulation on Apple Silicon.
    environment:                     # arm64-native alternative: mcr.microsoft.com/azure-sql-edge (drop the platform line).
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "1qaz!QAZ"  # matches repo ./credential — LOCAL DEV ONLY; use a Secret in k8s.
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  app1:
    build:
      context: ./app1.backend
      network: host          # BuildKit's default bridge net drops parallel package downloads (nuget/npm ECONNRESET).
    image: taskdesk/app1-dotnet:dev
    environment:
      ASPNETCORE_URLS: http://+:8080
      DB_PROVIDER: sqlserver
      DB_CONNECTION: "Server=mssql,1433;Database=taskdesk;User Id=sa;Password=1qaz!QAZ;TrustServerCertificate=True;Encrypt=False"
    depends_on:
      mssql:
        condition: service_healthy
    ports:
      - "8080:8080"

  app2:
    build:
      context: ./app2.backend
      network: host
    image: taskdesk/app2-go:dev
    environment:
      PORT: "8081"
      API_BASE: http://app1:8080
      REDIS_ADDR: valkey:6379
      SCAN_INTERVAL: 20s
    depends_on:
      app1:
        condition: service_started
      valkey:
        condition: service_healthy
    ports:
      - "8081:8081"

  app3:
    build:
      context: ./app3.backend
      network: host
    image: taskdesk/app3-node:dev
    environment:
      PORT: "8082"
      API_BASE: http://app1:8080
      REDIS_ADDR: valkey:6379
    depends_on:
      app1:
        condition: service_started
      valkey:
        condition: service_healthy
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./Frontend
      network: host          # BuildKit's default bridge network drops npm's parallel downloads (ECONNRESET); host net works.
    image: taskdesk/frontend:dev
    depends_on:
      - app3
    ports:
      - "8088:80"

volumes:
  mssql-data:
